<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0c0e">
  <title>Skulptur Surface</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="instrument">
    <header class="topbar">
      <div class="identity">
        <span class="name">SKULPTUR</span>
        <span id="status" class="status" role="status" aria-live="polite">停止中</span>
      </div>
      <div class="transport" aria-label="演奏操作">
        <button id="start" class="button start">DEMO START</button>
        <button id="record" class="button" disabled aria-pressed="false">REC</button>
        <button id="take" class="button" disabled aria-pressed="false">TAKE</button>
        <button id="flow" class="button" disabled aria-pressed="false">FLOW</button>
        <button id="clear" class="button quiet" disabled>CLEAR</button>
      </div>
    </header>

    <div class="progress" aria-hidden="true"><span id="progress"></span></div>

    <section class="surface-shell" aria-label="スペクトル演奏面">
      <div class="zone-label feedback-label">FEEDBACK</div>
      <div class="zone-label cut-label">CUT</div>
      <div id="surface" class="surface disabled" aria-label="左が低音、右が高音。中央から下で削り、上でFeedback">
        <div class="feedback-zone"></div>
        <div class="cut-zone"></div>
        <div class="neutral-line"></div>
        <div id="bands" class="bands" aria-hidden="true"></div>
      </div>
      <div class="frequency-labels" aria-hidden="true">
        <span>LOW</span><span>MID</span><span>HIGH</span>
      </div>
    </section>

    <footer class="buses" aria-label="入力バス。LOOPを押すと音声ファイルを差し替え">
      <button class="bus loop-slot" data-track="0" disabled>LOOP 1</button>
      <button class="bus loop-slot" data-track="1" disabled>LOOP 2</button>
      <button class="bus loop-slot" data-track="2" disabled>LOOP 3</button>
      <button class="bus loop-slot" data-track="3" disabled>LOOP 4</button>
      <span class="bus drum">DRUM / BYPASS</span>
    </footer>
    <input id="audio-file" class="visually-hidden" type="file" accept="audio/*">
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
