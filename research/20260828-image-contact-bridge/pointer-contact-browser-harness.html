<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sound Lab Contact Bridge Browser Harness</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #f4f1ea; color: #181818; }
    main { width: min(840px, 100%); margin: auto; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 22px; }
    .boundary { font-size: 14px; color: #4c4942; }
    #surface { height: 280px; display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid #181818; touch-action: none; user-select: none; background: white; }
    .track { display: grid; place-items: center; border-right: 1px solid #181818; font-weight: 700; }
    .track:last-child { border-right: 0; }
    .track[data-active="true"] { background: #ffd84a; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 42px; padding: 8px 12px; border: 1px solid #181818; background: white; color: #181818; font: inherit; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; margin: 0; }
    dt { font-weight: 700; }
    dd { margin: 0; }
    pre { min-height: 150px; max-height: 280px; overflow: auto; margin: 0; padding: 12px; background: #181818; color: #f6f3ec; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>接触入力bridge ブラウザ診断</h1>
    <div class="boundary">研究用診断面。DSP、録音、音声出力、製品UIは接続していない。</div>
    <div id="surface" aria-label="4トラック接触面">
      <div class="track" data-track="0">TRACK 1</div>
      <div class="track" data-track="1">TRACK 2</div>
      <div class="track" data-track="2">TRACK 3</div>
      <div class="track" data-track="3">TRACK 4</div>
    </div>
    <div class="controls">
      <button id="synthetic-contact" type="button">合成CONTACT</button>
      <button id="synthetic-move" type="button">合成SLIDE</button>
      <button id="synthetic-cancel" type="button">合成POINTERCANCEL</button>
      <button id="orientation-cancel" type="button">画面回転中断</button>
      <button id="reset" type="button">ログ消去</button>
    </div>
    <dl>
      <dt>受理frame</dt><dd id="frame-count">0</dd>
      <dt>active pointer</dt><dd id="active-count">0</dd>
      <dt>最後のphase</dt><dd id="last-phase">なし</dd>
      <dt>pressure</dt><dd id="pressure-state">なし</dd>
      <dt>エラー</dt><dd id="error-state">なし</dd>
    </dl>
    <pre id="event-log" aria-label="受理された接触frame">まだframeはない</pre>
  </main>
  <script type="module">
    import { bindPointerContactSurface } from "./pointer-contact-adapter.mjs";

    const surface = document.querySelector("#surface");
    const tracks = [...document.querySelectorAll(".track")];
    const frames = [];
    const errors = [];
    const frameCount = document.querySelector("#frame-count");
    const activeCount = document.querySelector("#active-count");
    const lastPhase = document.querySelector("#last-phase");
    const pressureState = document.querySelector("#pressure-state");
    const errorState = document.querySelector("#error-state");
    const eventLog = document.querySelector("#event-log");

    function render() {
      const last = frames.at(-1);
      frameCount.textContent = String(frames.length);
      activeCount.textContent = String(binding.adapter.activeCount());
      lastPhase.textContent = last?.phase ?? "なし";
      pressureState.textContent = last ? `${last.pressureSource} / ${String(last.pressure)}` : "なし";
      errorState.textContent = errors.at(-1)?.message ?? "なし";
      eventLog.textContent = frames.length ? frames.map(frame => JSON.stringify(frame)).join("\n") : "まだframeはない";
      for (const track of tracks) track.dataset.active = String(Boolean(last && last.phase !== "release" && last.phase !== "cancel" && last.trackIds.includes(Number(track.dataset.track))));
    }

    const binding = bindPointerContactSurface({
      surface,
      scope: window,
      resolveTrackIds: ({ x }) => [Math.min(3, Math.floor(x * 4))],
      onFrame(frame) { frames.push(frame); render(); },
      onError(error) { errors.push(error); render(); },
    });

    function dispatchPointer(type, xRatio, yRatio, timeOffset = 0) {
      const rect = surface.getBoundingClientRect();
      surface.dispatchEvent(new PointerEvent(type, {
        bubbles: true,
        pointerId: 91,
        pointerType: "touch",
        isPrimary: true,
        clientX: rect.left + rect.width * xRatio,
        clientY: rect.top + rect.height * yRatio,
        pressure: type === "pointerup" ? 0 : 0.5,
      }));
    }

    document.querySelector("#synthetic-contact").addEventListener("click", () => dispatchPointer("pointerdown", 0.125, 0.5));
    document.querySelector("#synthetic-move").addEventListener("click", () => dispatchPointer("pointermove", 0.625, 0.4));
    document.querySelector("#synthetic-cancel").addEventListener("click", () => dispatchPointer("pointercancel", 0.625, 0.4));
    document.querySelector("#orientation-cancel").addEventListener("click", () => window.dispatchEvent(new Event("orientationchange")));
    document.querySelector("#reset").addEventListener("click", () => {
      frames.length = 0;
      errors.length = 0;
      render();
    });
    window.__contactHarness = { frames, errors, binding };
    render();
  </script>
</body>
</html>
