const input=$('#input'),hpf=$('#hpf'),density=$('#density'),air=$('#air'),output=$('#output'),mode=$('#mode'),preampMode=$('#preampMode'),xy=$('#xy'),waveform=$('#waveform'),drumsOpen=$('#drumsOpen');

function preampCurve(amount){const n=4096,c=new Float32Array(n),drive=db(amount),norm=Math.tanh(drive*1.035);for(let i=0;i<n;i++){const x=i*2/(n-1)-1,asym=x+.035*x*x;c[i]=Math.tanh(asym*drive)/norm}return c}
const preampProfiles={
body:{label:'BODY · REDD',bodyFreq:100,body:.018,presenceFreq:5000,presenceQ:.7,presence:.01,airFreq:10000,air:-.008,airActivity:0,threshold:0,thresholdDensity:0,ratioBase:1,ratioDensity:0,attack:.012,release:.14,colorBase:.25,colorDensity:.005,driveDensity:.07,makeup:0},
open:{label:'OPEN · TG',bodyFreq:50,body:.005,presenceFreq:5000,presenceQ:.75,presence:.012,airFreq:10000,air:.008,airActivity:0,threshold:-19.3,thresholdDensity:0,ratioBase:2,ratioDensity:0,attack:.001,release:.25,colorBase:.16,colorDensity:.0034,driveDensity:.025,makeup:0},
focus:{label:'FOCUS',bodyFreq:150,body:-.004,presenceFreq:2400,presenceQMin:.55,presenceQMax:1.35,presence:.014,airFreq:7600,air:-.01,airActivity:-.1,threshold:-5,thresholdDensity:-.18,ratioDensity:.03,attack:.008,release:.11,colorBase:.22,colorDensity:.0042,driveDensity:.043,makeup:.27}
};
function currentProfile(){return preampProfiles[preampStyle]||preampProfiles.body}
function characterPresenceQ(d,p=currentProfile()){return preampStyle==='focus'?p.presenceQMin+(p.presenceQMax-p.presenceQMin)*(d/100):p.presenceQ}
function analogAirDb(d,reduction=0){const p=currentProfile(),activity=Math.min(12,Math.max(0,-reduction));return d*p.air+activity*p.airActivity*(d/100)}
function analogBlend(d){const p=currentProfile(),color=p.colorBase+d*p.colorDensity;return{dry:1-color,color}}
function analogMakeupDb(d,reduction=0){const p=currentProfile(),activity=Math.min(12,Math.max(0,-reduction));return Math.min(2.5,activity*p.makeup*(d/100))}
function values(){const d=+density.value;$('#inputText').textContent=fmt(+input.value);$('#hpfText').textContent=`${hpf.value} Hz`;$('#densityText').textContent=`${d}%`;$('#airText').textContent=fmt(+air.value);$('#outputText').textContent=fmt(+output.value);if(ctx){const t=ctx.currentTime,p=currentProfile();inputGain.gain.setTargetAtTime(db(+input.value),t,.03);inputHP.frequency.setTargetAtTime(+hpf.value,t,.03);inputComp.threshold.setTargetAtTime(p.threshold+d*p.thresholdDensity,t,.03);inputComp.ratio.setTargetAtTime((p.ratioBase??1)+d*p.ratioDensity,t,.03);inputComp.attack.setTargetAtTime(p.attack,t,.03);inputComp.release.setTargetAtTime(p.release,t,.03);analogBody.frequency.setTargetAtTime(p.bodyFreq,t,.03);analogBody.gain.setTargetAtTime(d*p.body,t,.03);analogPresence.frequency.setTargetAtTime(p.presenceFreq,t,.03);analogPresence.Q.setTargetAtTime(characterPresenceQ(d,p),t,.03);analogPresence.gain.setTargetAtTime(d*p.presence,t,.03);analogAir.frequency.setTargetAtTime(p.airFreq,t,.03);analogAir.gain.setTargetAtTime(analogAirDb(d),t,.03);const blend=analogBlend(d);analogDryGain.gain.setTargetAtTime(blend.dry,t,.03);analogColorGain.gain.setTargetAtTime(blend.color,t,.03);analogMakeup.gain.setTargetAtTime(db(analogMakeupDb(d)),t,.12);inputSaturator.curve=preampCurve(1+d*p.driveDensity);if(abbeyNode&&(preampStyle==='body'||preampStyle==='open'))abbeyNode.port.postMessage({type:'configure',mode:preampStyle==='open'?'OPEN':'BODY',density:d/100});airGain.gain.setTargetAtTime(db(+air.value),t,.03);outputGain.gain.setTargetAtTime(db(+output.value),t,.03)}}

const preampOrder=['clean','body','open','focus'];
function setPreampMode(style){preampStyle=preampOrder.includes(style)?style:'clean';const colored=preampStyle!=='clean',abbeyRequested=preampStyle==='body'||preampStyle==='open',abbey=abbeyRequested&&abbeyWorkletReady,focus=preampStyle==='focus',fallback=!!ctx&&abbeyRequested&&!abbeyWorkletReady;preampMode.textContent=fallback?'PREAMP · CLEAN · FALLBACK':colored?`PREAMP · ${currentProfile().label}`:'PREAMP · CLEAN';density.disabled=!colored;if(ctx){const t=ctx.currentTime;cleanGain.gain.setTargetAtTime(!abbey&&!focus?1:0,t,.012);abbeyGain.gain.setTargetAtTime(abbey?1:0,t,.012);analogGain.gain.setTargetAtTime(focus?1:0,t,.012);values()}}

function impulse(ac){const len=ac.sampleRate*4|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let s=0;for(let i=0;i<len;i++){s=s*.78+(Math.random()*2-1)*.22;d[i]=s*Math.pow(1-i/len,3.4)}}return b}
function setState(lane,state,label=state.toUpperCase()){lane.state=state;lane.el.className=`loop ${state}`;lane.el.querySelector('.state').textContent=label}
function flatten(parts,n){const out=new Float32Array(n);let p=0;for(const part of parts){const take=Math.min(part.length,n-p);out.set(part.subarray(0,take),p);p+=take;if(p>=n)break}return out}
