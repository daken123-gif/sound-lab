<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#e7e3d7"><title>Field Looper 04</title>
<style>
:root{color-scheme:light;--paper:#e7e3d7;--ink:#11110f;--line:#aaa69b;--panel:#f4f1e8;--red:#f24f42;--yellow:#f1c84b;--blue:#4f9fd7;--green:#61a86d;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper)}body{color:var(--ink);user-select:none;touch-action:manipulation}button,input{font:inherit}button{color:inherit}#app{position:fixed;inset:0;display:grid;grid-template-rows:44px minmax(0,1fr) 76px;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:var(--paper)}header{display:grid;grid-template-columns:112px minmax(0,1fr) 178px;gap:8px;min-width:0}.mark,.input-control,.clock{border:1.5px solid var(--ink);background:var(--panel);min-width:0}.mark{display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;font-weight:800;letter-spacing:.08em}.mark strong{font-size:21px;letter-spacing:-.05em}.input-control{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:8px;padding:5px 7px}#inputButton{height:30px;border:0;border-radius:0;background:var(--ink);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em}#inputButton.active{background:var(--red)}#inputButton:disabled{opacity:.45}.meter{height:12px;border:1px solid var(--ink);background:#d1cdc1;overflow:hidden}#meterFill{width:0;height:100%;background:var(--green)}#inputState{min-width:64px;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right}.clock{display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}#notice{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#55524b}#sessionTime{font-size:15px;color:var(--ink)}.tracks{min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:6px}.track{--track-color:var(--red);min-height:0;display:grid;grid-template-columns:58px minmax(90px,1fr) 212px;border:1.5px solid var(--ink);background:var(--panel)}.track[data-track="2"]{--track-color:var(--yellow)}.track[data-track="3"]{--track-color:var(--blue)}.track[data-track="4"]{--track-color:var(--green)}.track-id{display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px;border-right:1.5px solid var(--ink);background:var(--track-color)}.track-id strong{font-size:24px;line-height:.8}.track-id span{font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.wave{position:relative;min-width:0;border-right:1.5px solid var(--ink);background:#f8f5ed}.wave canvas{width:100%;height:100%;display:block}.track-time{position:absolute;right:7px;bottom:5px;padding:2px 4px;background:rgba(248,245,237,.9);font:700 8px ui-monospace,SFMono-Regular,Menlo,monospace}.track-controls{display:grid;grid-template-columns:1.25fr 1fr 1fr .7fr;gap:5px;padding:6px}.track-controls button{min-width:0;border:1.5px solid var(--ink);border-radius:0;background:transparent;font-size:9px;font-weight:800;letter-spacing:.04em}.track-controls button:active{transform:translateY(1px)}.rec{background:var(--track-color)!important}.rec.armed{background:var(--red)!important;color:#fff}.play.playing{background:var(--ink)!important;color:#fff}.erase{font-size:15px!important}.track.empty .play,.track.empty .stop,.track.empty .erase{opacity:.28}.track.recording{outline:3px solid var(--red);outline-offset:-3px}footer{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:8px;min-width:0}.master{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:center;padding:7px 10px;border:1.5px solid var(--ink);background:var(--panel)}.parameter{min-width:0}.parameter label{display:flex;justify-content:space-between;margin-bottom:5px;font:800 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}.parameter input{width:100%;margin:0;accent-color:var(--ink)}.global{display:grid;grid-template-columns:1fr 1fr;gap:6px}.global button{border:1.5px solid var(--ink);border-radius:0;background:var(--panel);font-size:10px;font-weight:800;letter-spacing:.06em}#playAll{background:var(--yellow)}#stopAll{background:var(--blue)}
@media(orientation:portrait){#app{grid-template-rows:48px minmax(0,1fr) 116px}header{grid-template-columns:78px minmax(0,1fr)}.mark{padding:0 7px}.mark span{display:none}.clock{display:none}.input-control{grid-template-columns:82px 1fr 56px}.track{grid-template-columns:48px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 38px}.track-id{grid-row:1/3}.wave{border-right:0;border-bottom:1.5px solid var(--ink)}.track-controls{grid-column:2;padding:4px}footer{grid-template-columns:1fr;grid-template-rows:72px 38px}.master{gap:7px;padding:5px 7px}.global{grid-row:2}}@media(max-height:420px) and (orientation:landscape){#app{grid-template-rows:38px minmax(0,1fr) 62px;gap:5px;padding-top:max(5px,env(safe-area-inset-top));padding-bottom:max(5px,env(safe-area-inset-bottom))}header{grid-template-columns:96px minmax(0,1fr) 160px;gap:5px}.track{grid-template-columns:50px minmax(80px,1fr) 198px}.track-id{padding:5px 7px}.track-id strong{font-size:19px}.track-controls{padding:4px;gap:4px}footer{grid-template-columns:minmax(0,1fr) 210px;gap:5px}.master{padding:4px 8px}}
</style></head><body><main id="app"><header><div class="mark"><span>FIELD</span><strong>04</strong></div><div class="input-control"><button id="inputButton" type="button">INPUT ON</button><div class="meter" aria-label="入力レベル"><div id="meterFill"></div></div><span id="inputState">MIC OFF</span></div><div class="clock"><span id="notice">INPUTを先に起動</span><span id="sessionTime">00:00</span></div></header><section id="tracks" class="tracks" aria-label="4トラック録音機"></section><footer><section class="master" aria-label="マスター設定"><div class="parameter"><label><span>INPUT</span><output id="inputGainValue">0 dB</output></label><input id="inputGain" type="range" min="-18" max="18" value="0"></div><div class="parameter"><label><span>MONITOR</span><output id="monitorValue">OFF</output></label><input id="monitor" type="range" min="-60" max="0" value="-60"></div><div class="parameter"><label><span>OUTPUT</span><output id="outputValue">-6 dB</output></label><input id="output" type="range" min="-24" max="0" value="-6"></div></section><section class="global"><button id="playAll" type="button">PLAY ALL</button><button id="stopAll" type="button">STOP ALL</button></section></footer></main>
<script>
const $=selector=>document.querySelector(selector),db=value=>Math.pow(10,value/20),MAX_SECONDS=60,colors=['#f24f42','#f1c84b','#4f9fd7','#61a86d'];let context=null,stream=null,microphone=null,inputGainNode=null,monitorGainNode=null,masterGainNode=null,analyser=null,captureNode=null,silentNode=null,meterFrame=0,inputStartedAt=0,inputActive=false;const tracksElement=$('#tracks'),tracks=Array.from({length:4},(_,index)=>createTrack(index));
function createTrack(index){const element=document.createElement('article');element.className='track empty';element.dataset.track=String(index+1);element.innerHTML=`<div class="track-id"><strong>${index+1}</strong><span>EMPTY</span></div><div class="wave"><canvas aria-label="トラック${index+1}の波形"></canvas><span class="track-time">00:00.0</span></div><div class="track-controls"><button class="rec" type="button">REC</button><button class="play" type="button">PLAY</button><button class="stop" type="button">STOP</button><button class="erase" type="button" aria-label="消去">×</button></div>`;tracksElement.append(element);const track={index,element,canvas:element.querySelector('canvas'),stateLabel:element.querySelector('.track-id span'),timeLabel:element.querySelector('.track-time'),recButton:element.querySelector('.rec'),playButton:element.querySelector('.play'),stopButton:element.querySelector('.stop'),eraseButton:element.querySelector('.erase'),state:'empty',chunks:[],frames:0,buffer:null,source:null,startedAt:0,peaks:[],peakMaximum:0,livePeaks:[],previewTick:0,silent:false};track.recButton.addEventListener('click',()=>toggleRecord(track));track.playButton.addEventListener('click',()=>playTrack(track));track.stopButton.addEventListener('click',()=>stopTrack(track));track.eraseButton.addEventListener('click',()=>clearTrack(track));requestAnimationFrame(()=>drawTrack(track));return track}
function setNotice(message){$('#notice').textContent=message}function setTrackState(track,state){track.state=state;track.element.className=`track ${state}`;const labels={empty:'EMPTY',recording:'RECORDING',ready:'READY',playing:'PLAYING'};track.stateLabel.textContent=labels[state]||state.toUpperCase();track.recButton.classList.toggle('armed',state==='recording');track.recButton.textContent=state==='recording'?'FINISH':'REC';track.playButton.classList.toggle('playing',state==='playing')}
function audioConstraints(){return{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1,sampleRate:{ideal:48000}}}
async function createCaptureNode(){if(context.audioWorklet&&typeof AudioWorkletNode!=='undefined'){const processor=`class FieldCapture extends AudioWorkletProcessor{process(inputs){const channel=inputs[0]&&inputs[0][0];if(channel){const copy=channel.slice(0);this.port.postMessage(copy,[copy.buffer])}return true}}registerProcessor('field-capture',FieldCapture);`,url=URL.createObjectURL(new Blob([processor],{type:'text/javascript'}));try{await context.audioWorklet.addModule(url);const node=new AudioWorkletNode(context,'field-capture',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});node.port.onmessage=event=>captureChunk(new Float32Array(event.data));return node}catch{setNotice('互換録音モード')}finally{URL.revokeObjectURL(url)}}const node=context.createScriptProcessor(1024,1,1);node.onaudioprocess=event=>captureChunk(event.inputBuffer.getChannelData(0));return node}
async function startInput(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('MIC_UNAVAILABLE');setNotice('マイクへ接続中');context=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await context.resume();stream=await navigator.mediaDevices.getUserMedia({audio:audioConstraints()});microphone=context.createMediaStreamSource(stream);inputGainNode=context.createGain();monitorGainNode=context.createGain();masterGainNode=context.createGain();analyser=context.createAnalyser();analyser.fftSize=1024;silentNode=context.createGain();silentNode.gain.value=0;captureNode=await createCaptureNode();microphone.connect(inputGainNode);inputGainNode.connect(analyser);inputGainNode.connect(captureNode);captureNode.connect(silentNode).connect(context.destination);inputGainNode.connect(monitorGainNode).connect(masterGainNode).connect(context.destination);applyLevels();inputActive=true;inputStartedAt=performance.now();$('#inputButton').classList.add('active');$('#inputButton').textContent='INPUT OFF';const track=stream.getAudioTracks()[0],rate=track?.getSettings?.().sampleRate||context.sampleRate;$('#inputState').textContent=`${Math.round(rate/1000)}k ON`;setNotice('トラックのRECを押す');updateMeter()}
async function stopInput(){tracks.forEach(stopTrack);inputActive=false;cancelAnimationFrame(meterFrame);stream?.getTracks().forEach(track=>track.stop());await context?.close();context=null;stream=null;$('#meterFill').style.width='0%';$('#inputButton').classList.remove('active');$('#inputButton').textContent='INPUT ON';$('#inputState').textContent='MIC OFF';$('#sessionTime').textContent='00:00';setNotice('INPUTを先に起動')}
$('#inputButton').addEventListener('click',async()=>{const button=$('#inputButton');button.disabled=true;try{inputActive?await stopInput():await startInput()}catch(error){await stopInput();const messages={NotAllowedError:'マイク許可が必要',NotFoundError:'マイクが見つからない',NotReadableError:'マイクを使用できない',MIC_UNAVAILABLE:'このブラウザでは録音不可'},key=error?.name==='Error'?error.message:error?.name;setNotice(messages[key]||`入力失敗: ${key||'UNKNOWN'}`)}finally{button.disabled=false}});
function captureChunk(channel){if(!inputActive||!context)return;for(const track of tracks){if(track.state!=='recording')continue;const remaining=context.sampleRate*MAX_SECONDS-track.frames,count=Math.min(channel.length,remaining);if(count>0){const copy=channel.slice(0,count);track.chunks.push(copy);track.frames+=count;let peak=0;for(const sample of copy)peak=Math.max(peak,Math.abs(sample));track.previewTick++;if(track.previewTick%6===0){track.livePeaks.push(peak);updateTrackTime(track,track.frames/context.sampleRate,null,'REC ');drawTrack(track)}}if(remaining<=channel.length)finishRecord(track)}}
function toggleRecord(track){if(track.state==='recording'){finishRecord(track);return}if(!inputActive||!context){setNotice('先にINPUT ON');return}tracks.filter(item=>item!==track&&item.state==='recording').forEach(finishRecord);stopSource(track);track.chunks=[];track.frames=0;track.buffer=null;track.peaks=[];track.peakMaximum=0;track.livePeaks=[];track.previewTick=0;track.silent=false;updateTrackTime(track,0,null,'REC ');setTrackState(track,'recording');setNotice(`TRACK ${track.index+1} 録音中`);drawTrack(track)}
function buildPeaks(data,resolution=512){const values=[],step=Math.max(1,Math.ceil(data.length/resolution));let maximum=0;for(let start=0;start<data.length;start+=step){let peak=0;const end=Math.min(data.length,start+step);for(let index=start;index<end;index++)peak=Math.max(peak,Math.abs(data[index]));values.push(peak);maximum=Math.max(maximum,peak)}return{values,maximum}}
function finishRecord(track){if(track.state!=='recording'||!context)return;if(track.frames<context.sampleRate*.08){clearTrack(track);setNotice('録音が短すぎます');return}const data=new Float32Array(track.frames);let offset=0;for(const chunk of track.chunks){data.set(chunk,offset);offset+=chunk.length}const fade=Math.min(Math.floor(context.sampleRate*.01),Math.floor(data.length/4));for(let index=0;index<fade;index++){const amount=index/Math.max(1,fade);data[index]*=amount;data[data.length-1-index]*=amount}track.buffer=context.createBuffer(1,data.length,context.sampleRate);track.buffer.copyToChannel(data,0);const peakData=buildPeaks(data);track.peaks=peakData.values;track.peakMaximum=peakData.maximum;track.silent=peakData.maximum<.0005;track.chunks=[];track.livePeaks=[];setTrackState(track,'ready');updateTrackTime(track,track.buffer.duration);drawTrack(track);setNotice(track.silent?`TRACK ${track.index+1} 無音です`:`TRACK ${track.index+1} 録音完了`)}
function playTrack(track){if(!context||!track.buffer)return;stopSource(track);const source=context.createBufferSource();source.buffer=track.buffer;source.loop=true;source.connect(masterGainNode);source.start();track.source=source;track.startedAt=context.currentTime;setTrackState(track,'playing');drawTrack(track,0);setNotice(`TRACK ${track.index+1} 再生`)}function stopSource(track){if(!track.source)return;try{track.source.stop()}catch{}track.source.disconnect();track.source=null}function stopTrack(track){if(track.state==='recording'){finishRecord(track);return}stopSource(track);if(track.buffer){setTrackState(track,'ready');updateTrackTime(track,track.buffer.duration);drawTrack(track)}}function clearTrack(track){stopSource(track);track.chunks=[];track.frames=0;track.buffer=null;track.peaks=[];track.peakMaximum=0;track.livePeaks=[];track.previewTick=0;track.silent=false;updateTrackTime(track,0);setTrackState(track,'empty');drawTrack(track);setNotice(`TRACK ${track.index+1} 消去`)}
$('#playAll').addEventListener('click',()=>tracks.forEach(track=>track.buffer&&playTrack(track)));$('#stopAll').addEventListener('click',()=>tracks.forEach(stopTrack));function formatTime(seconds){const minutes=Math.floor(seconds/60),remainder=seconds-minutes*60;return`${String(minutes).padStart(2,'0')}:${remainder.toFixed(1).padStart(4,'0')}`}function updateTrackTime(track,seconds,total=null,prefix=''){track.timeLabel.textContent=total===null?`${prefix}${formatTime(seconds)}`:`${formatTime(seconds)} / ${formatTime(total)}`}
function drawTrack(track,playhead=null){const rect=track.canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1,width=Math.max(1,Math.round(rect.width)),height=Math.max(1,Math.round(rect.height));track.canvas.width=Math.round(width*ratio);track.canvas.height=Math.round(height*ratio);const draw=track.canvas.getContext('2d');draw.scale(ratio,ratio);draw.clearRect(0,0,width,height);draw.strokeStyle='#aaa69b';draw.lineWidth=1;draw.beginPath();draw.moveTo(0,height/2);draw.lineTo(width,height/2);draw.stroke();const recording=track.state==='recording',peaks=recording?track.livePeaks:track.peaks;if(peaks.length){const maximum=Math.max(.000001,recording?Math.max(...peaks):track.peakMaximum),span=recording?width*Math.min(1,track.frames/(context.sampleRate*MAX_SECONDS)):width;draw.strokeStyle=colors[track.index];draw.lineWidth=Math.max(1,span/Math.max(1,peaks.length)*.72);draw.beginPath();for(let index=0;index<peaks.length;index++){const x=peaks.length===1?0:index/(peaks.length-1)*span,amplitude=peaks[index]/maximum*height*.42;draw.moveTo(x,height/2-amplitude);draw.lineTo(x,height/2+amplitude)}draw.stroke()}if(track.silent&&!recording){draw.fillStyle='#777269';draw.font='700 10px ui-monospace,monospace';draw.textAlign='center';draw.fillText('SILENCE',width/2,height/2-8)}if(playhead!==null){const x=Math.max(0,Math.min(width,width*playhead));draw.strokeStyle='#11110f';draw.lineWidth=2;draw.beginPath();draw.moveTo(x,0);draw.lineTo(x,height);draw.stroke();draw.fillStyle='#11110f';draw.beginPath();draw.moveTo(x-5,0);draw.lineTo(x+5,0);draw.lineTo(x,7);draw.closePath();draw.fill()}}
function updateMeter(){if(!inputActive||!analyser||!context)return;const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);let sum=0;for(const value of data)sum+=value*value;const rms=Math.sqrt(sum/data.length),level=Math.max(0,Math.min(100,(20*Math.log10(Math.max(rms,.00001))+60)/60*100));$('#meterFill').style.width=`${level}%`;const elapsed=Math.floor((performance.now()-inputStartedAt)/1000);$('#sessionTime').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;for(const track of tracks)if(track.state==='playing'&&track.buffer){const current=(context.currentTime-track.startedAt)%track.buffer.duration,position=current/track.buffer.duration;updateTrackTime(track,current,track.buffer.duration);drawTrack(track,position)}meterFrame=requestAnimationFrame(updateMeter)}
function applyLevels(){const inputValue=Number($('#inputGain').value),monitorValue=Number($('#monitor').value),outputValue=Number($('#output').value);$('#inputGainValue').textContent=`${inputValue>0?'+':''}${inputValue} dB`;$('#monitorValue').textContent=monitorValue<=-60?'OFF':`${monitorValue} dB`;$('#outputValue').textContent=`${outputValue} dB`;if(!context)return;const time=context.currentTime;inputGainNode?.gain.setTargetAtTime(db(inputValue),time,.02);monitorGainNode?.gain.setTargetAtTime(monitorValue<=-60?0:db(monitorValue),time,.02);masterGainNode?.gain.setTargetAtTime(db(outputValue),time,.02)}['inputGain','monitor','output'].forEach(id=>$(`#${id}`).addEventListener('input',applyLevels));applyLevels();window.addEventListener('resize',()=>tracks.forEach(drawTrack));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&inputActive)context?.resume()});
</script></body></html>
