<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#070909" />
  <title>Ambient Loop</title>
  <style>
    :root { color-scheme: dark; font-family: ui-rounded, -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070909; }
    body { touch-action: none; user-select: none; }
    #field { position: fixed; inset: 0; overflow: hidden; background:
      radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(164,255,210,.22), transparent 34%),
      linear-gradient(145deg,#101817,#050606 65%); }
    #field::after { content:""; position:absolute; inset:0; opacity:var(--level,.08); background:radial-gradient(circle,#d8ffe9 0 1px,transparent 2px); background-size:17px 17px; mix-blend-mode:screen; }
    .top { position:absolute; z-index:2; top:max(18px,env(safe-area-inset-top)); left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; font-size:12px; letter-spacing:.16em; color:#b7c5bf; }
    #status::before { content:""; display:inline-block; width:7px; height:7px; margin-right:8px; border-radius:50%; background:#4e5b56; }
    .running #status::before { background:#9fffc8; box-shadow:0 0 14px #75ffad; }
    #start { position:absolute; z-index:3; left:50%; top:50%; width:152px; height:152px; transform:translate(-50%,-50%); border:1px solid rgba(208,255,228,.3); border-radius:50%; color:#e9fff2; background:rgba(11,22,18,.58); backdrop-filter:blur(18px); font:500 17px/1 ui-rounded,-apple-system,sans-serif; letter-spacing:.12em; box-shadow:0 24px 70px rgba(0,0,0,.45), inset 0 0 40px rgba(160,255,204,.05); }
    .running #start { width:70px; height:70px; top:auto; bottom:max(26px,env(safe-area-inset-bottom)); font-size:11px; opacity:.72; }
    #readout { position:absolute; z-index:2; left:20px; right:20px; bottom:max(28px,env(safe-area-inset-bottom)); color:#aebbb5; font-size:11px; line-height:1.7; letter-spacing:.1em; }
    .running #readout { bottom:max(110px,calc(env(safe-area-inset-bottom) + 92px)); }
    #meters { position:absolute; z-index:2; top:max(62px,calc(env(safe-area-inset-top) + 44px)); left:20px; right:20px; padding:14px; border:1px solid rgba(183,255,215,.16); border-radius:13px; background:rgba(4,9,7,.54); backdrop-filter:blur(12px); }
    .meter { display:grid; grid-template-columns:38px 1fr 27px; gap:9px; align-items:center; margin:7px 0; color:#afbeb7; font-size:10px; letter-spacing:.1em; }
    .track { height:13px; overflow:hidden; border-radius:3px; background:repeating-linear-gradient(90deg,#23302b 0 calc(5% - 2px),transparent calc(5% - 2px) 5%); }
    .fill { width:0%; height:100%; background:repeating-linear-gradient(90deg,#6bff9f 0 calc(5% - 2px),transparent calc(5% - 2px) 5%); filter:drop-shadow(0 0 5px #62ff9a); transition:width 38ms linear; }
    .meter.out .fill { background:repeating-linear-gradient(90deg,#82d7ff 0 calc(5% - 2px),transparent calc(5% - 2px) 5%); filter:drop-shadow(0 0 5px #54c9ff); }
    .gains { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:13px; padding-top:12px; border-top:1px solid rgba(183,255,215,.12); }
    .gain label { display:flex; justify-content:space-between; margin-bottom:7px; color:#9eada6; font-size:9px; letter-spacing:.09em; }
    input[type="range"] { width:100%; height:24px; margin:0; accent-color:#9fffc8; }
    #hint { position:absolute; z-index:2; left:50%; top:calc(50% + 96px); transform:translateX(-50%); white-space:nowrap; color:#74817c; font-size:11px; letter-spacing:.08em; }
    .running #hint { display:none; }
  </style>
</head>
<body>
  <main id="field" aria-label="環境音プロセッサの操作面">
    <div class="top"><span>AMBIENT LOOP</span><span id="status">停止中</span></div>
    <button id="start" type="button">聴きはじめる</button>
    <div id="hint">マイクの使用を許可してください</div>
    <div id="meters">
      <div class="meter"><span>MIC</span><div class="track"><div id="inputFill" class="fill"></div></div><span id="inputValue">0</span></div>
      <div class="meter out"><span>OUT</span><div class="track"><div id="outputFill" class="fill"></div></div><span id="outputValue">0</span></div>
      <div class="gains">
        <div class="gain"><label for="inputGain"><span>INPUT GAIN</span><span id="inputDb">+8 dB</span></label><input id="inputGain" type="range" min="-12" max="24" value="8" step="1"></div>
        <div class="gain"><label for="outputGain"><span>OUTPUT GAIN</span><span id="outputDb">+6 dB</span></label><input id="outputGain" type="range" min="-24" max="12" value="6" step="1"></div>
      </div>
    </div>
    <div id="readout"><div id="space">SPACE 46</div><div id="return">RETURN 34</div></div>
  </main>
  <script>
    const field = document.querySelector('#field');
    const button = document.querySelector('#start');
    const status = document.querySelector('#status');
    const spaceText = document.querySelector('#space');
    const returnText = document.querySelector('#return');
    const inputFill = document.querySelector('#inputFill');
    const outputFill = document.querySelector('#outputFill');
    const inputValue = document.querySelector('#inputValue');
    const outputValue = document.querySelector('#outputValue');
    const inputGainControl = document.querySelector('#inputGain');
    const outputGainControl = document.querySelector('#outputGain');
    const inputDbText = document.querySelector('#inputDb');
    const outputDbText = document.querySelector('#outputDb');
    let ctx, stream, source, analyser, raf, wakeLock;
    let inputAnalyser, delay, feedback, filter, wet, dry, monitor, master, outputGain;
    let running = false;
    const dbToGain = db => Math.pow(10, db / 20);
    const signedDb = db => `${db > 0 ? '+' : ''}${db} dB`;

    const applyGains = () => {
      const inputDb = Number(inputGainControl.value);
      const outputDb = Number(outputGainControl.value);
      inputDbText.textContent = signedDb(inputDb);
      outputDbText.textContent = signedDb(outputDb);
      if (ctx) {
        monitor?.gain.setTargetAtTime(dbToGain(inputDb), ctx.currentTime, .02);
        outputGain?.gain.setTargetAtTime(dbToGain(outputDb), ctx.currentTime, .02);
      }
    };

    const setSurface = (x, y) => {
      const nx = Math.max(0, Math.min(1, x / innerWidth));
      const ny = Math.max(0, Math.min(1, y / innerHeight));
      field.style.setProperty('--x', `${nx * 100}%`);
      field.style.setProperty('--y', `${ny * 100}%`);
      if (!ctx) return;
      const t = ctx.currentTime;
      const space = 0.035 + nx * 0.92;
      const returnAmount = 0.16 + (1 - ny) * 0.77;
      delay.delayTime.setTargetAtTime(space, t, .04);
      feedback.gain.setTargetAtTime(returnAmount, t, .04);
      filter.frequency.setTargetAtTime(550 + (1 - ny) * 7000, t, .04);
      wet.gain.setTargetAtTime(.34 + nx * .52, t, .04);
      spaceText.textContent = `SPACE ${Math.round(nx * 100)}`;
      returnText.textContent = `RETURN ${Math.round(returnAmount * 100)}`;
    };

    const meter = () => {
      const level = node => {
        const data = new Uint8Array(node.fftSize);
        node.getByteTimeDomainData(data);
        let sum = 0;
        for (const n of data) { const v = (n - 128) / 128; sum += v * v; }
        return Math.sqrt(sum / data.length);
      };
      const input = level(inputAnalyser);
      const output = level(analyser);
      const inputPercent = Math.min(100, Math.round(input * 520));
      const outputPercent = Math.min(100, Math.round(output * 420));
      inputFill.style.width = `${inputPercent}%`; outputFill.style.width = `${outputPercent}%`;
      inputValue.textContent = inputPercent; outputValue.textContent = outputPercent;
      field.style.setProperty('--level', String(Math.min(.72, .06 + output * 4)));
      raf = requestAnimationFrame(meter);
    };

    async function start() {
      ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      await ctx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1
      }});
      source = ctx.createMediaStreamSource(stream);
      inputAnalyser = ctx.createAnalyser(); inputAnalyser.fftSize = 256;
      monitor = ctx.createGain(); monitor.gain.value = dbToGain(Number(inputGainControl.value));
      filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 3600; filter.Q.value = 1.1;
      delay = ctx.createDelay(1.2); delay.delayTime.value = .46;
      feedback = ctx.createGain(); feedback.gain.value = .34;
      wet = ctx.createGain(); wet.gain.value = .62;
      dry = ctx.createGain(); dry.gain.value = .28;
      master = ctx.createDynamicsCompressor();
      master.threshold.value = -12; master.knee.value = 4; master.ratio.value = 12; master.attack.value = .002; master.release.value = .14;
      outputGain = ctx.createGain(); outputGain.gain.value = dbToGain(Number(outputGainControl.value));
      analyser = ctx.createAnalyser(); analyser.fftSize = 256;

      source.connect(inputAnalyser);
      source.connect(monitor);
      monitor.connect(dry).connect(master);
      monitor.connect(filter).connect(delay).connect(wet).connect(master);
      delay.connect(feedback).connect(filter);
      master.connect(outputGain).connect(analyser).connect(ctx.destination);
      running = true;
      document.body.classList.add('running');
      status.textContent = '聴取中'; button.textContent = '停止';
      setSurface(innerWidth * .46, innerHeight * .62);
      meter();
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen').catch(() => null);
    }

    async function stop() {
      running = false;
      cancelAnimationFrame(raf);
      stream?.getTracks().forEach(track => track.stop());
      await ctx?.close();
      ctx = null;
      await wakeLock?.release().catch(() => {});
      document.body.classList.remove('running');
      status.textContent = '停止中'; button.textContent = '聴きはじめる';
      field.style.setProperty('--level', '.08');
      inputFill.style.width = outputFill.style.width = '0%';
      inputValue.textContent = outputValue.textContent = '0';
    }

    button.addEventListener('click', async (event) => {
      event.stopPropagation();
      button.disabled = true;
      try { running ? await stop() : await start(); }
      catch (error) { status.textContent = 'マイクを許可してください'; await stop(); }
      finally { button.disabled = false; }
    });
    field.addEventListener('pointerdown', e => { if (running && e.target !== button) setSurface(e.clientX, e.clientY); });
    field.addEventListener('pointermove', e => { if (running && e.buttons) setSurface(e.clientX, e.clientY); });
    inputGainControl.addEventListener('input', applyGains);
    outputGainControl.addEventListener('input', applyGains);
    applyGains();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && running) ctx?.resume(); });
  </script>
</body>
</html>
