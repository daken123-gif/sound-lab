<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070a0a"><title>Field Looper</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0a}body{touch-action:manipulation;user-select:none}main{position:fixed;inset:0;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 36%,rgba(116,255,193,.14),transparent 42%),linear-gradient(155deg,#121b19,#050707 70%);display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;color:#b9c7c1;font-size:11px;letter-spacing:.15em}.top i{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#46534e}.running .top i{background:#8fffc0;box-shadow:0 0 12px #61ff9f}.meters,.controls{padding:12px;border:1px solid rgba(180,255,214,.15);border-radius:14px;background:rgba(5,10,8,.55);backdrop-filter:blur(12px)}.meter{display:grid;grid-template-columns:32px 1fr 24px;gap:8px;align-items:center;margin:6px 0;color:#aebbb6;font-size:9px;letter-spacing:.09em}.bar{height:11px;background:repeating-linear-gradient(90deg,#26332e 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);overflow:hidden}.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#6effa4 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);filter:drop-shadow(0 0 4px #6effa4)}.out .fill{background:repeating-linear-gradient(90deg,#73ccff 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);filter:drop-shadow(0 0 4px #73ccff)}.loops{flex:1;min-height:150px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.loop{position:relative;border:1px solid rgba(174,255,210,.16);border-radius:40px;background:rgba(7,15,12,.58);overflow:hidden;color:#8d9b95}.loop::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--p,0%);background:linear-gradient(0deg,rgba(102,255,164,.35),rgba(102,255,164,.04));transition:height 60ms linear}.loop.play{border-color:rgba(127,233,255,.32);box-shadow:inset 0 0 25px rgba(81,195,255,.07)}.loop.capture{border-color:#83ffc0;box-shadow:0 0 16px rgba(83,255,163,.18)}.loop.muted{opacity:.35}.loop span{position:absolute;z-index:1;left:0;right:0;text-align:center}.loop .n{top:15px;font-size:15px}.loop .state{bottom:17px;font-size:8px;letter-spacing:.08em}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.control label{display:flex;justify-content:space-between;color:#9daba5;font-size:8px;letter-spacing:.07em;margin-bottom:5px}.control input{width:100%;height:22px;margin:0;accent-color:#91ffc0}button#echo,button#start{align-self:center;width:100%;border:1px solid rgba(201,255,225,.27);background:rgba(15,30,24,.8);color:#e8fff2;font:500 12px ui-rounded,-apple-system,sans-serif;letter-spacing:.1em}button#echo{height:34px;border-radius:17px;color:#9fffc4}button#echo:disabled{opacity:.45}button#start{height:52px;border-radius:26px}.note{text-align:center;color:#6f7e78;font-size:9px;line-height:1.45;letter-spacing:.06em}
</style></head><body><main>
<div class="top"><span>FIELD LOOPER</span><span><i></i><b id="status">停止中</b></span></div>
<section class="meters"><div class="meter"><span>MIC</span><div class="bar"><div id="inFill" class="fill"></div></div><span id="inVal">0</span></div><div class="meter out"><span>OUT</span><div class="bar"><div id="outFill" class="fill"></div></div><span id="outVal">0</span></div></section>
<section id="loops" class="loops" aria-label="5つの自動ループ"></section>
<section class="controls"><div class="control"><label><span>INPUT</span><span id="inputText">+8 dB</span></label><input id="input" type="range" min="-12" max="24" value="8"></div><div class="control"><label><span>AIR</span><span id="airText">-42 dB</span></label><input id="air" type="range" min="-60" max="-6" value="-42"></div><div class="control"><label><span>OUTPUT</span><span id="outputText">0 dB</span></label><input id="output" type="range" min="-24" max="9" value="0"></div></section>
<button id="echo" type="button">ECHO CANCELLATION · ON</button>
<button id="start" type="button">外の音を聴きはじめる</button><div class="note">声や外音を検出すると録音開始 → 5本へ循環<br>各レーンをタップすると消音／復帰</div>
</main><script>
const $=s=>document.querySelector(s),db=v=>Math.pow(10,v/20),fmt=v=>`${v>0?'+':''}${v} dB`;
const durations=[3.7,5.3,7.9,11.3,17.1],rates=[1,.997,1.003,.994,1.006],trackLevels=[.30,.28,.27,.25,.23];
const loopBox=$('#loops'),lanes=durations.map((seconds,i)=>{const el=document.createElement('button');el.className='loop';el.innerHTML=`<span class="n">${i+1}</span><span class="state">WAIT</span>`;loopBox.append(el);return{seconds,el,muted:false,data:[],frames:0,source:null,gain:null,filter:null}});
let ctx,stream,mic,inputGain,inputHP,inputLP,inputComp,airGain,airDelay,recorder,recorderSink,loopBus,reverb,reverbGain,master,outputGain,inAnalyser,outAnalyser,raf,wakeLock,active=0,running=false,armed=false,echoCancellation=true;
const input=$('#input'),air=$('#air'),output=$('#output'),echo=$('#echo');
function values(){$('#inputText').textContent=fmt(+input.value);$('#airText').textContent=fmt(+air.value);$('#outputText').textContent=fmt(+output.value);if(ctx){inputGain.gain.setTargetAtTime(db(+input.value),ctx.currentTime,.03);airGain.gain.setTargetAtTime(db(+air.value),ctx.currentTime,.03);outputGain.gain.setTargetAtTime(db(+output.value),ctx.currentTime,.03)}}
[input,air,output].forEach(x=>x.addEventListener('input',values));values();
echo.addEventListener('click',()=>{if(running)return;echoCancellation=!echoCancellation;echo.textContent=`ECHO CANCELLATION · ${echoCancellation?'ON':'OFF'}`});
lanes.forEach((l,i)=>l.el.addEventListener('click',()=>{l.muted=!l.muted;l.el.classList.toggle('muted',l.muted);if(l.gain&&ctx)l.gain.gain.setTargetAtTime(l.muted?0:trackLevels[i],ctx.currentTime,.08)}));
function impulse(ac){const len=ac.sampleRate*4|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let s=0;for(let i=0;i<len;i++){s=s*.78+(Math.random()*2-1)*.22;d[i]=s*Math.pow(1-i/len,3.4)}}return b}
function capture(chunk){if(!running)return;if(!armed){let sum=0;for(const v of chunk)sum+=v*v;if(Math.sqrt(sum/chunk.length)<.014)return;armed=true;$('#status').textContent='循環録音中'}const lane=lanes[active],need=Math.floor(lane.seconds*ctx.sampleRate)-lane.frames,take=Math.min(need,chunk.length);lane.data.push(chunk.slice(0,take));lane.frames+=take;lane.el.style.setProperty('--p',`${Math.min(100,lane.frames/(lane.seconds*ctx.sampleRate)*100)}%`);lane.el.classList.add('capture');lane.el.querySelector('.state').textContent='REC';if(lane.frames>=Math.floor(lane.seconds*ctx.sampleRate)){commit(lane);lane.el.classList.remove('capture');active=(active+1)%lanes.length;const next=lanes[active];next.data=[];next.frames=0;next.el.style.setProperty('--p','0%')}}
function commit(lane){const n=lane.frames,buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);let p=0;for(const x of lane.data){d.set(x,p);p+=x.length}const fade=Math.min(ctx.sampleRate*.12|0,n/8|0);for(let i=0;i<fade;i++){const a=i/fade,tail=d[n-fade+i],head=d[i];d[n-fade+i]=tail*(1-a)+head*a}const index=lanes.indexOf(lane),src=ctx.createBufferSource();src.buffer=buf;src.loop=true;src.playbackRate.value=rates[index];const g=ctx.createGain();g.gain.value=0;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=7200-index*560;src.connect(f).connect(g).connect(loopBus);src.start();const now=ctx.currentTime,target=lane.muted?0:trackLevels[index];g.gain.linearRampToValueAtTime(target,now+1.2);if(lane.source){lane.gain.gain.cancelScheduledValues(now);lane.gain.gain.setValueAtTime(lane.gain.gain.value,now);lane.gain.gain.linearRampToValueAtTime(0,now+1.2);const old=lane.source;setTimeout(()=>{try{old.stop()}catch{}},1400)}lane.source=src;lane.gain=g;lane.filter=f;lane.data=[];lane.el.classList.add('play');lane.el.querySelector('.state').textContent=`${lane.seconds.toFixed(1)}s`}
function level(a){const d=new Uint8Array(a.fftSize);a.getByteTimeDomainData(d);let s=0;for(const n of d){const v=(n-128)/128;s+=v*v}return Math.sqrt(s/d.length)}
function meters(){const a=Math.min(100,Math.round(level(inAnalyser)*520)),b=Math.min(100,Math.round(level(outAnalyser)*430));$('#inFill').style.width=`${a}%`;$('#outFill').style.width=`${b}%`;$('#inVal').textContent=a;$('#outVal').textContent=b;raf=requestAnimationFrame(meters)}
async function start(){ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation,noiseSuppression:echoCancellation,autoGainControl:false,channelCount:1}});mic=ctx.createMediaStreamSource(stream);inputGain=ctx.createGain();inputHP=ctx.createBiquadFilter();inputHP.type='highpass';inputHP.frequency.value=85;inputLP=ctx.createBiquadFilter();inputLP.type='lowpass';inputLP.frequency.value=9000;inputComp=ctx.createDynamicsCompressor();inputComp.threshold.value=-24;inputComp.knee.value=16;inputComp.ratio.value=3;inputComp.attack.value=.006;inputComp.release.value=.18;airGain=ctx.createGain();airDelay=ctx.createDelay(.2);airDelay.delayTime.value=.055;loopBus=ctx.createGain();loopBus.gain.value=.86;reverb=ctx.createConvolver();reverb.buffer=impulse(ctx);reverbGain=ctx.createGain();reverbGain.gain.value=.16;master=ctx.createDynamicsCompressor();master.threshold.value=-12;master.knee.value=10;master.ratio.value=4;master.attack.value=.008;master.release.value=.35;outputGain=ctx.createGain();inAnalyser=ctx.createAnalyser();outAnalyser=ctx.createAnalyser();inAnalyser.fftSize=outAnalyser.fftSize=256;recorder=ctx.createScriptProcessor(2048,1,1);recorderSink=ctx.createGain();recorderSink.gain.value=0;recorder.onaudioprocess=e=>capture(e.inputBuffer.getChannelData(0));mic.connect(inputGain).connect(inputHP).connect(inputLP).connect(inputComp);inputComp.connect(inAnalyser);inputComp.connect(recorder);recorder.connect(recorderSink).connect(ctx.destination);inputComp.connect(airDelay).connect(airGain).connect(master);loopBus.connect(master);loopBus.connect(reverb).connect(reverbGain).connect(master);master.connect(outputGain).connect(outAnalyser).connect(ctx.destination);running=true;armed=false;active=0;lanes.forEach(l=>{l.data=[];l.frames=0});values();echo.disabled=true;document.body.classList.add('running');$('#status').textContent='声／外音待ち';$('#start').textContent='停止';meters();if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen').catch(()=>null)}
async function stop(){running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());await ctx?.close();ctx=null;await wakeLock?.release().catch(()=>{});wakeLock=null;echo.disabled=false;document.body.classList.remove('running');$('#status').textContent='停止中';$('#start').textContent='外の音を聴きはじめる';lanes.forEach(l=>{l.source=null;l.gain=null;l.data=[];l.frames=0;l.el.className='loop';l.el.style.setProperty('--p','0%');l.el.querySelector('.state').textContent='WAIT'});$('#inFill').style.width=$('#outFill').style.width='0';$('#inVal').textContent=$('#outVal').textContent='0'}
$('#start').addEventListener('click',async()=>{const b=$('#start');b.disabled=true;try{running?await stop():await start()}catch(e){await stop();$('#status').textContent='マイクを許可してください'}finally{b.disabled=false}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)ctx?.resume()});
</script></body></html>
