<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070a0a"><title>Field Looper</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a0a}body{touch-action:manipulation;user-select:none}main{position:fixed;inset:0;padding:max(18px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 36%,rgba(116,255,193,.14),transparent 42%),linear-gradient(155deg,#121b19,#050707 70%);display:flex;flex-direction:column;gap:11px}.top{display:flex;justify-content:space-between;color:#b9c7c1;font-size:11px;letter-spacing:.15em}.top i{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:#46534e}.running .top i{background:#8fffc0;box-shadow:0 0 12px #61ff9f}.meters,.controls{padding:10px 12px;border:1px solid rgba(180,255,214,.15);border-radius:14px;background:rgba(5,10,8,.55);backdrop-filter:blur(12px)}.meter{display:grid;grid-template-columns:32px 1fr 24px;gap:8px;align-items:center;margin:5px 0;color:#aebbb6;font-size:9px;letter-spacing:.09em}.bar{height:11px;background:repeating-linear-gradient(90deg,#26332e 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);overflow:hidden}.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#6effa4 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);filter:drop-shadow(0 0 4px #6effa4)}.out .fill{background:repeating-linear-gradient(90deg,#73ccff 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);filter:drop-shadow(0 0 4px #73ccff)}.loops{flex:1;min-height:142px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:7px}.lane{display:flex;min-width:0;flex-direction:column;align-items:center;gap:9px}.loop{--p:0%;--c:#35443e;position:relative;width:100%;aspect-ratio:1;border:0;border-radius:50%;background:conic-gradient(var(--c) var(--p),#1a2420 0);color:#91a099;box-shadow:0 0 0 1px rgba(183,255,216,.17)}.loop::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#09100e}.loop.recording{--c:#ff6678;box-shadow:0 0 18px rgba(255,69,94,.27)}.loop.playing{--c:#65dbff;box-shadow:0 0 18px rgba(76,198,255,.2)}.loop.overdubbing{--c:#ffbd57;box-shadow:0 0 18px rgba(255,176,64,.24)}.loop.stopped{--c:#78857f}.loop span{position:absolute;z-index:1;left:0;right:0;text-align:center}.loop .n{top:24%;font-size:14px}.loop .state{bottom:24%;font-size:7px;letter-spacing:.06em}.stop{width:100%;height:27px;border:1px solid rgba(190,215,204,.15);border-radius:14px;background:#101714;color:#77837e;font:600 7px ui-rounded,-apple-system,sans-serif;letter-spacing:.05em}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.control label{display:flex;justify-content:space-between;color:#9daba5;font-size:8px;letter-spacing:.07em;margin-bottom:5px}.control input{width:100%;height:22px;margin:0;accent-color:#91ffc0}button#echo,button#start{align-self:center;width:100%;border:1px solid rgba(201,255,225,.27);background:rgba(15,30,24,.8);color:#e8fff2;font:500 12px ui-rounded,-apple-system,sans-serif;letter-spacing:.1em}button#echo{height:32px;border-radius:16px;color:#9fffc4}button#echo:disabled{opacity:.45}button#start{height:48px;border-radius:24px}.note{text-align:center;color:#73817c;font-size:8px;line-height:1.45;letter-spacing:.05em}
</style><style>
main{display:grid;grid-template-rows:auto 1fr auto;gap:8px}.workspace{min-height:0;display:grid;grid-template-columns:30% 40% 30%;gap:9px}.left{min-width:0;display:flex;flex-direction:column;gap:8px}.left .meters{padding:7px 8px}.loops{min-height:0;grid-template-columns:repeat(3,1fr);gap:6px}.lane{gap:6px}.stop{height:25px}.wave,.xy{position:relative;min-width:0;overflow:hidden;border:1px solid rgba(180,255,214,.15);border-radius:14px;background:rgba(5,10,8,.58)}.panel-title{position:absolute;z-index:2;top:9px;left:11px;color:#83928c;font-size:8px;letter-spacing:.1em;pointer-events:none}#waveform{width:100%;height:100%;display:block;touch-action:none}.xy{touch-action:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(110,219,255,.42) 0 4px,rgba(91,190,255,.12) 5px,transparent 33%),linear-gradient(135deg,rgba(73,255,160,.08),rgba(75,139,255,.08))}.xy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.5%,rgba(255,255,255,.06) 50%,transparent 50.5%),linear-gradient(0deg,transparent 49.5%,rgba(255,255,255,.06) 50%,transparent 50.5%);pointer-events:none}.toolbar{display:grid;grid-template-columns:1.8fr .85fr .85fr;gap:8px;align-items:center}.toolbar .controls{grid-row:1 / span 2}.toolbar button{min-width:0}.note{grid-column:2 / 4}.portrait{display:none}@media(orientation:portrait){main{grid-template-rows:auto auto 1fr auto}.workspace{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr}.left{display:grid;grid-template-columns:1fr 2fr}.wave,.xy{min-height:120px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .controls{grid-column:1 / 3;grid-row:auto}.note{grid-column:1 / 3}.portrait{display:block;position:fixed;z-index:20;inset:0;background:#070a0a;color:#b9c7c1;text-align:center;padding-top:45vh;font-size:12px;letter-spacing:.08em}}
button#mode{align-self:center;width:100%;height:32px;border:1px solid rgba(201,255,225,.27);border-radius:16px;background:rgba(15,30,24,.8);color:#9fffc4;font:500 9px ui-rounded,-apple-system,sans-serif;letter-spacing:.04em}button#mode:disabled{opacity:.45}
</style></head><body><main>
<div class="top"><span>FIELD LOOPER</span><span><i></i><b id="status">停止中</b></span></div>
<section class="workspace"><div class="left"><section class="meters"><div class="meter"><span>MIC</span><div class="bar"><div id="inFill" class="fill"></div></div><span id="inVal">0</span></div><div class="meter out"><span>OUT</span><div class="bar"><div id="outFill" class="fill"></div></div><span id="outVal">0</span></div></section><section id="loops" class="loops" aria-label="3つの手動ループ"></section></div><section class="wave"><span class="panel-title">COMPOSITE WAVE · TOUCH TO SEEK</span><canvas id="waveform"></canvas></section><section id="xy" class="xy"><span class="panel-title">KAOSS MASTER · X TONE / Y SPACE</span></section></section>
<section class="toolbar"><section class="controls"><div class="control"><label><span>INPUT</span><span id="inputText">+8 dB</span></label><input id="input" type="range" min="-12" max="24" value="8"></div><div class="control"><label><span>MONITOR</span><span id="airText">0 dB</span></label><input id="air" type="range" min="-60" max="6" value="0"></div><div class="control"><label><span>OUTPUT</span><span id="outputText">0 dB</span></label><input id="output" type="range" min="-24" max="9" value="0"></div></section><button id="mode" type="button">HEADPHONES · ECHO OFF</button><button id="start" type="button">マイクを起動</button><div class="note">円：REC → PLAY → DUB　　STOP長押し：CLEAR</div></section>
<div class="portrait">iPhoneを横向きにしてください</div>
</main><script>
const $=s=>document.querySelector(s),db=v=>Math.pow(10,v/20),fmt=v=>`${v>0?'+':''}${v} dB`;
const rates=[1,.997,1.003],trackLevels=[.34,.32,.30],maxRecordSeconds=30;
const loopBox=$('#loops'),lanes=Array.from({length:3},(_,i)=>{const wrap=document.createElement('div'),el=document.createElement('button'),stopButton=document.createElement('button');wrap.className='lane';el.className='loop empty';el.innerHTML=`<span class="n">${i+1}</span><span class="state">EMPTY</span>`;stopButton.className='stop';stopButton.textContent='STOP';wrap.append(el,stopButton);loopBox.append(wrap);return{el,stopButton,state:'empty',data:[],frames:0,dubData:[],dubFrames:0,buffer:null,source:null,gain:null,filter:null,startedAt:0}});
let ctx,stream,mic,inputGain,inputHP,inputLP,inputComp,airGain,airDelay,recorder,recorderSink,loopBus,reverb,reverbGain,kaossFilter,kaossDelay,kaossFeedback,kaossWet,masterDry,master,outputGain,inAnalyser,outAnalyser,raf,wakeLock,running=false,headphones=true,echoCancellation=false,xyX=.5,xyY=.5,waveTouch=-1;
const input=$('#input'),air=$('#air'),output=$('#output'),mode=$('#mode'),xy=$('#xy'),waveform=$('#waveform');
function values(){$('#inputText').textContent=fmt(+input.value);$('#airText').textContent=fmt(+air.value);$('#outputText').textContent=fmt(+output.value);if(ctx){inputGain.gain.setTargetAtTime(db(+input.value),ctx.currentTime,.03);airGain.gain.setTargetAtTime(db(+air.value),ctx.currentTime,.03);outputGain.gain.setTargetAtTime(db(+output.value),ctx.currentTime,.03)}}
[input,air,output].forEach(x=>x.addEventListener('input',values));values();
mode.addEventListener('click',()=>{if(running)return;headphones=!headphones;echoCancellation=!headphones;air.value=headphones?0:-30;mode.textContent=headphones?'HEADPHONES · ECHO OFF':'SPEAKER · ECHO ON';values()});
lanes.forEach(l=>{l.el.addEventListener('click',()=>trackTap(l));let hold;l.stopButton.addEventListener('pointerdown',()=>{hold=setTimeout(()=>clearLane(l),650)});l.stopButton.addEventListener('pointerup',()=>{if(hold){clearTimeout(hold);hold=null;stopLane(l)}});l.stopButton.addEventListener('pointercancel',()=>{clearTimeout(hold);hold=null})});
function impulse(ac){const len=ac.sampleRate*4|0,b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let s=0;for(let i=0;i<len;i++){s=s*.78+(Math.random()*2-1)*.22;d[i]=s*Math.pow(1-i/len,3.4)}}return b}
function setState(lane,state,label=state.toUpperCase()){lane.state=state;lane.el.className=`loop ${state}`;lane.el.querySelector('.state').textContent=label}
function flatten(parts,n){const out=new Float32Array(n);let p=0;for(const part of parts){const take=Math.min(part.length,n-p);out.set(part.subarray(0,take),p);p+=take;if(p>=n)break}return out}
function softenEdges(data){const fade=Math.min(ctx.sampleRate*.08|0,data.length/8|0);for(let i=0;i<fade;i++){const a=i/fade,tail=data[data.length-fade+i],head=data[i];data[data.length-fade+i]=tail*(1-a)+head*a}}
function capture(chunk){if(!running)return;for(const lane of lanes){if(lane.state==='recording'){const max=ctx.sampleRate*maxRecordSeconds|0,take=Math.min(chunk.length,max-lane.frames);if(take>0){lane.data.push(chunk.slice(0,take));lane.frames+=take}if(lane.frames>=max)finishRecord(lane)}else if(lane.state==='overdubbing'){const need=lane.buffer.length-lane.dubFrames,take=Math.min(chunk.length,need);if(take>0){lane.dubData.push(chunk.slice(0,take));lane.dubFrames+=take}if(lane.dubFrames>=lane.buffer.length)finishOverdub(lane)}}}
function playLane(lane,position=0){if(!lane.buffer)return;stopSource(lane);const i=lanes.indexOf(lane),src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter(),offset=Math.max(0,Math.min(lane.buffer.duration-.001,position*lane.buffer.duration));src.buffer=lane.buffer;src.loop=true;src.playbackRate.value=rates[i];g.gain.value=trackLevels[i];f.type='lowpass';f.frequency.value=7200-i*500;src.connect(f).connect(g).connect(loopBus);src.start(0,offset);lane.source=src;lane.gain=g;lane.filter=f;lane.startedAt=ctx.currentTime-offset/rates[i];setState(lane,'playing','PLAY')}
function stopSource(lane){if(lane.source){try{lane.source.stop()}catch{}lane.source=null}}
function beginRecord(lane){lane.data=[];lane.frames=0;lane.el.style.setProperty('--p','0%');setState(lane,'recording','REC')}
function finishRecord(lane){if(lane.frames<ctx.sampleRate*.12){clearLane(lane);return}const data=flatten(lane.data,lane.frames);softenEdges(data);const buf=ctx.createBuffer(1,data.length,ctx.sampleRate);buf.copyToChannel(data,0);lane.buffer=buf;lane.data=[];playLane(lane);drawWave()}
function beginOverdub(lane){if(!lane.buffer)return;stopSource(lane);playLane(lane);lane.dubData=[];lane.dubFrames=0;setState(lane,'overdubbing','DUB')}
function finishOverdub(lane){if(!lane.buffer)return;const old=lane.buffer.getChannelData(0),dub=flatten(lane.dubData,lane.buffer.length),mix=new Float32Array(old.length);for(let i=0;i<mix.length;i++)mix[i]=Math.tanh(old[i]*.92+dub[i]*.72);softenEdges(mix);const buf=ctx.createBuffer(1,mix.length,ctx.sampleRate);buf.copyToChannel(mix,0);lane.buffer=buf;lane.dubData=[];lane.dubFrames=0;playLane(lane);drawWave()}
function trackTap(lane){if(!running){$('#status').textContent='先にマイクを起動';return}if(lane.state==='empty')beginRecord(lane);else if(lane.state==='recording')finishRecord(lane);else if(lane.state==='playing')beginOverdub(lane);else if(lane.state==='overdubbing')finishOverdub(lane);else if(lane.state==='stopped')playLane(lane)}
function stopLane(lane){if(lane.state==='recording'){lane.data=[];lane.frames=0;setState(lane,'empty','EMPTY');lane.el.style.setProperty('--p','0%');return}if(lane.state==='overdubbing'){lane.dubData=[];lane.dubFrames=0}stopSource(lane);if(lane.buffer)setState(lane,'stopped','STOP')}
function clearLane(lane){stopSource(lane);lane.buffer=null;lane.data=[];lane.frames=0;lane.dubData=[];lane.dubFrames=0;lane.el.style.setProperty('--p','0%');setState(lane,'empty','EMPTY');drawWave()}
function drawWave(){const box=waveform.getBoundingClientRect(),dpr=devicePixelRatio||1,w=Math.max(1,box.width|0),h=Math.max(1,box.height|0);waveform.width=w*dpr;waveform.height=h*dpr;const c=waveform.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);c.strokeStyle='rgba(118,232,255,.85)';c.lineWidth=1.4;c.beginPath();const buffers=lanes.map(l=>l.buffer).filter(Boolean);for(let x=0;x<w;x++){let v=0;for(const b of buffers){const d=b.getChannelData(0),i=Math.min(d.length-1,Math.floor(x/w*d.length));v+=d[i]/Math.max(1,buffers.length)}const y=h*.5-v*h*.38;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();c.strokeStyle='rgba(255,255,255,.12)';c.beginPath();c.moveTo(0,h*.5);c.lineTo(w,h*.5);c.stroke();if(waveTouch>=0){c.strokeStyle='rgba(255,190,86,.9)';c.beginPath();c.moveTo(w*waveTouch,0);c.lineTo(w*waveTouch,h);c.stroke()}}
function seekComposite(e){const r=waveform.getBoundingClientRect();waveTouch=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));for(const lane of lanes)if(lane.buffer&&lane.state==='playing')playLane(lane,waveTouch);drawWave()}
waveform.addEventListener('pointerdown',e=>{waveform.setPointerCapture(e.pointerId);seekComposite(e)});waveform.addEventListener('pointermove',e=>{if(e.buttons)seekComposite(e)});
function setKaoss(e){const r=xy.getBoundingClientRect();xyX=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));xyY=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));xy.style.setProperty('--x',`${xyX*100}%`);xy.style.setProperty('--y',`${xyY*100}%`);if(!ctx)return;const t=ctx.currentTime;kaossFilter.frequency.setTargetAtTime(500*Math.pow(20,xyX),t,.03);kaossDelay.delayTime.setTargetAtTime(.035+xyX*.31,t,.03);kaossFeedback.gain.setTargetAtTime(.08+(1-xyY)*.42,t,.03);kaossWet.gain.setTargetAtTime(.05+(1-xyY)*.48,t,.03);masterDry.gain.setTargetAtTime(.95-((1-xyY)*.18),t,.03)}
xy.addEventListener('pointerdown',e=>{xy.setPointerCapture(e.pointerId);setKaoss(e)});xy.addEventListener('pointermove',e=>{if(e.buttons)setKaoss(e)});
function level(a){const d=new Uint8Array(a.fftSize);a.getByteTimeDomainData(d);let s=0;for(const n of d){const v=(n-128)/128;s+=v*v}return Math.sqrt(s/d.length)}
function meters(){const a=Math.min(100,Math.round(level(inAnalyser)*520)),b=Math.min(100,Math.round(level(outAnalyser)*430));$('#inFill').style.width=`${a}%`;$('#outFill').style.width=`${b}%`;$('#inVal').textContent=a;$('#outVal').textContent=b;for(const lane of lanes){let p=0;if(lane.state==='recording')p=Math.min(100,lane.frames/(ctx.sampleRate*maxRecordSeconds)*100);else if(lane.state==='overdubbing')p=lane.dubFrames/lane.buffer.length*100;else if(lane.state==='playing'&&lane.buffer)p=((ctx.currentTime-lane.startedAt)*ctx.sampleRate%lane.buffer.length)/lane.buffer.length*100;lane.el.style.setProperty('--p',`${p}%`)}raf=requestAnimationFrame(meters)}
async function start(){ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation,noiseSuppression:echoCancellation,autoGainControl:false,channelCount:1}});mic=ctx.createMediaStreamSource(stream);inputGain=ctx.createGain();inputHP=ctx.createBiquadFilter();inputHP.type='highpass';inputHP.frequency.value=70;inputLP=ctx.createBiquadFilter();inputLP.type='lowpass';inputLP.frequency.value=12000;inputComp=ctx.createDynamicsCompressor();inputComp.threshold.value=-26;inputComp.knee.value=18;inputComp.ratio.value=2.5;inputComp.attack.value=.005;inputComp.release.value=.16;airGain=ctx.createGain();airDelay=ctx.createDelay(.2);airDelay.delayTime.value=headphones?.018:.055;loopBus=ctx.createGain();loopBus.gain.value=.9;masterDry=ctx.createGain();masterDry.gain.value=.86;kaossFilter=ctx.createBiquadFilter();kaossFilter.type='lowpass';kaossFilter.frequency.value=5000;kaossFilter.Q.value=.7;kaossDelay=ctx.createDelay(.5);kaossDelay.delayTime.value=.19;kaossFeedback=ctx.createGain();kaossFeedback.gain.value=.28;kaossWet=ctx.createGain();kaossWet.gain.value=.28;reverb=ctx.createConvolver();reverb.buffer=impulse(ctx);reverbGain=ctx.createGain();reverbGain.gain.value=.12;master=ctx.createDynamicsCompressor();master.threshold.value=-10;master.knee.value=10;master.ratio.value=3;master.attack.value=.006;master.release.value=.3;outputGain=ctx.createGain();inAnalyser=ctx.createAnalyser();outAnalyser=ctx.createAnalyser();inAnalyser.fftSize=outAnalyser.fftSize=256;recorder=ctx.createScriptProcessor(2048,1,1);recorderSink=ctx.createGain();recorderSink.gain.value=0;recorder.onaudioprocess=e=>capture(e.inputBuffer.getChannelData(0));mic.connect(inputGain).connect(inputHP).connect(inputLP).connect(inputComp);inputComp.connect(inAnalyser);inputComp.connect(recorder);recorder.connect(recorderSink).connect(ctx.destination);inputComp.connect(airDelay).connect(airGain).connect(master);loopBus.connect(masterDry).connect(master);loopBus.connect(kaossFilter);kaossFilter.connect(kaossDelay).connect(kaossWet).connect(master);kaossDelay.connect(kaossFeedback).connect(kaossDelay);kaossFilter.connect(reverb).connect(reverbGain).connect(master);master.connect(outputGain).connect(outAnalyser).connect(ctx.destination);running=true;values();mode.disabled=true;document.body.classList.add('running');$('#status').textContent=headphones?'イヤホン監聴中':'スピーカー監聴中';$('#start').textContent='マイク停止';drawWave();meters();if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen').catch(()=>null)}
async function stop(){running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());await ctx?.close();ctx=null;await wakeLock?.release().catch(()=>{});wakeLock=null;mode.disabled=false;document.body.classList.remove('running');$('#status').textContent='停止中';$('#start').textContent='マイクを起動';lanes.forEach(l=>{l.source=null;l.gain=null;l.buffer=null;l.data=[];l.frames=0;l.dubData=[];l.dubFrames=0;l.el.style.setProperty('--p','0%');setState(l,'empty','EMPTY')});drawWave();$('#inFill').style.width=$('#outFill').style.width='0';$('#inVal').textContent=$('#outVal').textContent='0'}
$('#start').addEventListener('click',async()=>{const b=$('#start');b.disabled=true;try{running?await stop():await start()}catch(e){await stop();$('#status').textContent='マイクを許可してください'}finally{b.disabled=false}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)ctx?.resume()});
</script></body></html>
