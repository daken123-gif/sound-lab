async function start(){$('#route').textContent='入力へ接続中…';$('#status').textContent='接続中';ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();const opened=await openPreferredInput();stream=opened.stream;const inputTrack=stream.getAudioTracks()[0],settings=inputTrack?.getSettings?.()||{};$('#route').textContent=`${opened.route} · ${settings.sampleRate?Math.round(settings.sampleRate/1000)+'k':'?'}Hz`;mic=ctx.createMediaStreamSource(stream);inputGain=ctx.createGain();inputHP=ctx.createBiquadFilter();inputHP.type='highpass';inputHP.frequency.value=25;inputHP.Q.value=.1;inputLP=ctx.createBiquadFilter();inputLP.type='lowpass';inputLP.frequency.value=19000;inputLP.Q.value=.1;inputComp=ctx.createDynamicsCompressor();inputComp.threshold.value=-12;inputComp.knee.value=18;inputComp.ratio.value=2.2;inputComp.attack.value=.012;inputComp.release.value=.14;analogDryGain=ctx.createGain();analogColorGain=ctx.createGain();analogMix=ctx.createGain();analogDryGain.gain.value=.575;analogColorGain.gain.value=.425;analogBody=ctx.createBiquadFilter();analogBody.type='lowshelf';analogBody.frequency.value=160;analogPresence=ctx.createBiquadFilter();analogPresence.type='peaking';analogPresence.frequency.value=4300;analogPresence.Q.value=.65;analogAir=ctx.createBiquadFilter();analogAir.type='highshelf';analogAir.frequency.value=10500;inputSaturator=ctx.createWaveShaper();inputSaturator.oversample='4x';inputSaturator.curve=preampCurve(3);inputDCBlock=ctx.createBiquadFilter();inputDCBlock.type='highpass';inputDCBlock.frequency.value=18;inputDCBlock.Q.value=.1;cleanGain=ctx.createGain();analogGain=ctx.createGain();preampBus=ctx.createGain();cleanGain.gain.value=1;analogGain.gain.value=0;airGain=ctx.createGain();loopBus=ctx.createGain();loopBus.gain.value=.9;masterDry=ctx.createGain();masterDry.gain.value=1;kaossFilter=ctx.createBiquadFilter();kaossFilter.type='lowpass';kaossFilter.frequency.value=19000;kaossFilter.Q.value=.2;kaossDelay=ctx.createDelay(.5);kaossDelay.delayTime.value=.12;kaossFeedback=ctx.createGain();kaossFeedback.gain.value=0;kaossWet=ctx.createGain();kaossWet.gain.value=0;reverb=ctx.createConvolver();reverb.buffer=impulse(ctx);reverbGain=ctx.createGain();reverbGain.gain.value=0;master=ctx.createDynamicsCompressor();master.threshold.value=-2;master.knee.value=3;master.ratio.value=1.5;master.attack.value=.003;master.release.value=.18;outputGain=ctx.createGain();inAnalyser=ctx.createAnalyser();outAnalyser=ctx.createAnalyser();inAnalyser.fftSize=outAnalyser.fftSize=1024;recorder=ctx.createScriptProcessor(1024,1,1);recorderSink=ctx.createGain();recorderSink.gain.value=0;recorder.onaudioprocess=e=>capture(e.inputBuffer.getChannelData(0));mic.connect(inputGain).connect(inputHP).connect(inputLP);inputLP.connect(cleanGain).connect(preampBus);inputLP.connect(inputComp);inputComp.connect(analogDryGain).connect(analogMix);inputComp.connect(analogBody).connect(analogPresence).connect(analogAir).connect(inputSaturator).connect(inputDCBlock).connect(analogColorGain).connect(analogMix);analogMix.connect(analogGain).connect(preampBus);preampBus.connect(inAnalyser);preampBus.connect(recorder);recorder.connect(recorderSink).connect(ctx.destination);preampBus.connect(airGain).connect(master);loopBus.connect(masterDry).connect(master);loopBus.connect(kaossFilter);kaossFilter.connect(kaossDelay).connect(kaossWet).connect(master);kaossDelay.connect(kaossFeedback).connect(kaossDelay);kaossFilter.connect(reverb).connect(reverbGain).connect(master);master.connect(outputGain).connect(outAnalyser).connect(ctx.destination);running=true;values();setPreampMode(analogMode);mode.disabled=true;document.body.classList.add('running');$('#status').textContent=headphones?`MIC PRE · ${Math.round(ctx.sampleRate/1000)}kHz`:'スピーカー監聴中';$('#start').textContent='マイク停止';drawWave();meters();if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen').catch(()=>null)}
async function stop(resetRoute=true){running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());await ctx?.close();ctx=null;await wakeLock?.release().catch(()=>{});wakeLock=null;mode.disabled=false;document.body.classList.remove('running');if(resetRoute)$('#route').textContent='TAP マイクを起動';$('#status').textContent='停止中';$('#start').textContent='マイクを起動';lanes.forEach(l=>{l.source=null;l.gain=null;l.buffer=null;l.data=[];l.frames=0;l.dubData=[];l.dubFrames=0;l.el.style.setProperty('--p','0%');setState(l,'empty','EMPTY')});drawWave();$('#inFill').style.width=$('#outFill').style.width='0';$('#inVal').textContent=$('#outVal').textContent='0'}
$('#start').addEventListener('click',async()=>{const b=$('#start');b.disabled=true;try{running?await stop():await start()}catch(e){const reason=e?.name||'AudioError';await stop(false);const messages={NotAllowedError:'マイクの許可が必要',NotFoundError:'入力マイクが見つかりません',NotReadableError:'マイクをほかの機能が使用中',OverconstrainedError:'指定した入力を使用できません'};$('#route').textContent=`入力失敗 · ${reason}`;$('#status').textContent=messages[reason]||'入力を開始できません'}finally{b.disabled=false}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)ctx?.resume()});
