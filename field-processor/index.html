<body>
  <main id="app">
    <header><div class="mark"><span>FIELD</span><strong>04</strong></div><div class="input-control"><button id="inputButton" type="button">INPUT ON</button><div class="meter" aria-label="入力レベル"><div id="meterFill"></div></div><span id="inputState">MIC OFF</span></div><div class="clock"><span id="notice">INPUTを先に起動</span><span id="sessionTime">00:00</span></div></header>
    <section id="tracks" class="tracks" aria-label="4トラック録音機"></section>
    <section class="performance" aria-label="4トラック共通時間軸"><div class="performance-id"><strong>TAPE</strong><span id="transportTime">00:00.0</span></div><div id="composite" class="composite"><canvas id="compositeWave" aria-label="4トラック合成波形"></canvas><span class="gesture-hint">TAP SEEK · DRAG LOOP · HOLD GRAB · TAP MARK MUTE · HOLD DELETE</span></div><div class="performance-controls"><button id="reverseButton" type="button">FORWARD</button><button id="takeButton" type="button">TAKE 0</button><button id="runTakeButton" type="button">RUN TAKE</button><div id="divisions" class="divisions" aria-label="ループの長さ"></div></div></section>
    <footer><section class="master" aria-label="マスター設定"><div class="parameter"><label><span>INPUT</span><output id="inputGainValue">0 dB</output></label><input id="inputGain" type="range" min="-18" max="18" value="0"></div><div class="parameter"><label><span>MONITOR</span><output id="monitorValue">OFF</output></label><input id="monitor" type="range" min="-60" max="0" value="-60"></div><div class="parameter"><label><span>OUTPUT</span><output id="outputValue">-6 dB</output></label><input id="output" type="range" min="-24" max="0" value="-6"></div></section><section class="global"><button id="playAll" type="button">PLAY TAPE</button><button id="stopAll" type="button">STOP</button></section></footer>
  </main>
  <script>
    const $=selector=>document.querySelector(selector),db=value=>Math.pow(10,value/20),MAX_SECONDS=60,colors=['#f24f42','#f1c84b','#4f9fd7','#61a86d'];
    const divisions=Object.freeze([{name:'1 BAR',label:'BAR',ratio:1},{name:'1/2',label:'1/2',ratio:1/2},{name:'1/4',label:'1/4',ratio:1/4},{name:'1/8',label:'1/8',ratio:1/8},{name:'1/16',label:'1/16',ratio:1/16},{name:'GRAIN',label:'GRN',ratio:1/64}]);
    let context=null,stream=null,microphone=null,inputGainNode=null,monitorGainNode=null,masterGainNode=null,analyser=null,captureNode=null,silentNode=null,meterFrame=0,inputStartedAt=0,inputActive=false,loopTimer=0;
    const transport={playing:false,duration:0,basePosition:0,anchorAt:0,loopStart:0,loopEnd:0,direction:1,divisionIndex:0},take={recording:false,playing:false,nextId:1,events:[],startedAt:0,playStartedAt:0,cursor:0,origin:null},tracksElement=$('#tracks'),tracks=Array.from({length:4},(_,index)=>createTrack(index));
    function createTrack(index){const element=document.createElement('article');element.className='track empty';element.dataset.track=String(index+1);element.innerHTML=`<div class="track-id"><strong>${index+1}</strong><span>EMPTY</span></div><div class="wave"><canvas aria-label="トラック${index+1}の波形"></canvas><span class="track-time">00:00.0</span></div><div class="track-controls"><button class="rec" type="button">REC</button><button class="play" type="button">PLAY</button><button class="stop" type="button">STOP</button><button class="erase" type="button" aria-label="消去">×</button></div>`;tracksElement.append(element);const track={index,element,canvas:element.querySelector('canvas'),stateLabel:element.querySelector('.track-id span'),timeLabel:element.querySelector('.track-time'),recButton:element.querySelector('.rec'),playButton:element.querySelector('.play'),stopButton:element.querySelector('.stop'),eraseButton:element.querySelector('.erase'),state:'empty',chunks:[],frames:0,buffer:null,reverseBuffer:null,source:null,peaks:[],peakMaximum:0,livePeaks:[],previewTick:0,silent:false};track.recButton.addEventListener('click',()=>toggleRecord(track));track.playButton.addEventListener('click',()=>playTrack(track));track.stopButton.addEventListener('click',()=>stopTrack(track));track.eraseButton.addEventListener('click',()=>clearTrack(track));requestAnimationFrame(()=>drawTrack(track));return track}
    function setNotice(message){$('#notice').textContent=message}function setTrackState(track,state){track.state=state;track.element.className=`track ${state}`;const labels={empty:'EMPTY',recording:'RECORDING',ready:'READY',playing:'PLAYING'};track.stateLabel.textContent=labels[state]||state.toUpperCase();track.recButton.classList.toggle('armed',state==='recording');track.recButton.textContent=state==='recording'?'FINISH':'REC';track.playButton.classList.toggle('playing',state==='playing')}
    function audioConstraints(){return{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1,sampleRate:{ideal:48000}}}
    async function createCaptureNode(){if(context.audioWorklet&&typeof AudioWorkletNode!=='undefined'){const processor=`class FieldCapture extends AudioWorkletProcessor{process(inputs){const channel=inputs[0]&&inputs[0][0];if(channel){const copy=channel.slice(0);this.port.postMessage(copy,[copy.buffer])}return true}}registerProcessor('field-capture',FieldCapture);`,url=URL.createObjectURL(new Blob([processor],{type:'text/javascript'}));try{await context.audioWorklet.addModule(url);const node=new AudioWorkletNode(context,'field-capture',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});node.port.onmessage=event=>captureChunk(new Float32Array(event.data));return node}catch{setNotice('互換録音モード')}finally{URL.revokeObjectURL(url)}}const node=context.createScriptProcessor(1024,1,1);node.onaudioprocess=event=>captureChunk(event.inputBuffer.getChannelData(0));return node}
    async function startInput(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('MIC_UNAVAILABLE');setNotice('マイクへ接続中');context=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await context.resume();stream=await navigator.mediaDevices.getUserMedia({audio:audioConstraints()});microphone=context.createMediaStreamSource(stream);inputGainNode=context.createGain();monitorGainNode=context.createGain();masterGainNode=context.createGain();analyser=context.createAnalyser();analyser.fftSize=1024;silentNode=context.createGain();silentNode.gain.value=0;captureNode=await createCaptureNode();microphone.connect(inputGainNode);inputGainNode.connect(analyser);inputGainNode.connect(captureNode);captureNode.connect(silentNode).connect(context.destination);inputGainNode.connect(monitorGainNode).connect(masterGainNode).connect(context.destination);applyLevels();inputActive=true;inputStartedAt=performance.now();$('#inputButton').classList.add('active');$('#inputButton').textContent='INPUT OFF';const mediaTrack=stream.getAudioTracks()[0],rate=mediaTrack?.getSettings?.().sampleRate||context.sampleRate;$('#inputState').textContent=`${Math.round(rate/1000)}k ON`;setNotice('トラックのRECを押す');updateFrame()}
    async function stopInput(){stopTransport();tracks.forEach(track=>track.state==='recording'&&finishRecord(track));inputActive=false;cancelAnimationFrame(meterFrame);stream?.getTracks().forEach(track=>track.stop());await context?.close();context=null;stream=null;$('#meterFill').style.width='0%';$('#inputButton').classList.remove('active');$('#inputButton').textContent='INPUT ON';$('#inputState').textContent='MIC OFF';$('#sessionTime').textContent='00:00';setNotice('INPUTを先に起動')}
    $('#inputButton').addEventListener('click',async()=>{const button=$('#inputButton');button.disabled=true;try{inputActive?await stopInput():await startInput()}catch(error){await stopInput();const messages={NotAllowedError:'マイク許可が必要',NotFoundError:'マイクが見つからない',NotReadableError:'マイクを使用できない',MIC_UNAVAILABLE:'このブラウザでは録音不可'},key=error?.name==='Error'?error.message:error?.name;setNotice(messages[key]||`入力失敗: ${key||'UNKNOWN'}`)}finally{button.disabled=false}});
    function captureChunk(channel){if(!inputActive||!context)return;for(const track of tracks){if(track.state!=='recording')continue;const remaining=context.sampleRate*MAX_SECONDS-track.frames,count=Math.min(channel.length,remaining);if(count>0){const copy=channel.slice(0,count);track.chunks.push(copy);track.frames+=count;let peak=0;for(const sample of copy)peak=Math.max(peak,Math.abs(sample));track.previewTick++;if(track.previewTick%6===0){track.livePeaks.push(peak);updateTrackTime(track,track.frames/context.sampleRate,null,'REC ');drawTrack(track);drawComposite()}}if(remaining<=channel.length)finishRecord(track)}}
    function toggleRecord(track){if(track.state==='recording'){finishRecord(track);return}if(!inputActive||!context){setNotice('先にINPUT ON');return}stopTransport();tracks.filter(item=>item!==track&&item.state==='recording').forEach(finishRecord);stopSource(track);Object.assign(track,{chunks:[],frames:0,buffer:null,reverseBuffer:null,peaks:[],peakMaximum:0,livePeaks:[],previewTick:0,silent:false});syncTransportDuration();updateTrackTime(track,0,null,'REC ');setTrackState(track,'recording');setNotice(`TRACK ${track.index+1} 録音中`);drawTrack(track);drawComposite()}
    function buildPeaks(data,resolution=512){const values=[],step=Math.max(1,Math.ceil(data.length/resolution));let maximum=0;for(let start=0;start<data.length;start+=step){let peak=0;const end=Math.min(data.length,start+step);for(let index=start;index<end;index++)peak=Math.max(peak,Math.abs(data[index]));values.push(peak);maximum=Math.max(maximum,peak)}return{values,maximum}}
    function createReverseBuffer(buffer){const reversed=context.createBuffer(1,buffer.length,buffer.sampleRate),source=buffer.getChannelData(0),output=reversed.getChannelData(0);for(let index=0;index<source.length;index++)output[index]=source[source.length-1-index];return reversed}
    function finishRecord(track){if(track.state!=='recording'||!context)return;if(track.frames<context.sampleRate*.08){clearTrack(track);setNotice('録音が短すぎます');return}const data=new Float32Array(track.frames);let offset=0;for(const chunk of track.chunks){data.set(chunk,offset);offset+=chunk.length}const fade=Math.min(Math.floor(context.sampleRate*.01),Math.floor(data.length/4));for(let index=0;index<fade;index++){const amount=index/Math.max(1,fade);data[index]*=amount;data[data.length-1-index]*=amount}track.buffer=context.createBuffer(1,data.length,context.sampleRate);track.buffer.copyToChannel(data,0);track.reverseBuffer=createReverseBuffer(track.buffer);const peakData=buildPeaks(data);track.peaks=peakData.values;track.peakMaximum=peakData.maximum;track.silent=peakData.maximum<.0005;track.chunks=[];track.livePeaks=[];setTrackState(track,'ready');updateTrackTime(track,track.buffer.duration);syncTransportDuration();drawTrack(track);drawComposite();setNotice(track.silent?`TRACK ${track.index+1} 無音です`:`TRACK ${track.index+1} 録音完了`)}
    function modulo(value,span){return((value%span)+span)%span}function transportPosition(at=context?.currentTime||0){if(!transport.playing||transport.duration<=0)return transport.basePosition;if(at<transport.anchorAt)return transport.basePosition;const span=Math.max(.001,transport.loopEnd-transport.loopStart),elapsed=(at-transport.anchorAt)*transport.direction;return transport.loopStart+modulo(transport.basePosition-transport.loopStart+elapsed,span)}
    function syncTransportDuration(){const previous=transport.duration,followedFullRange=transport.loopStart===0&&transport.loopEnd===previous;transport.duration=Math.max(0,...tracks.map(track=>track.buffer?.duration||0));if(transport.duration===0)Object.assign(transport,{playing:false,basePosition:0,loopStart:0,loopEnd:0});else if(followedFullRange||transport.loopEnd===0){transport.loopStart=0;transport.loopEnd=transport.duration}else{transport.loopStart=Math.min(transport.loopStart,transport.duration);transport.loopEnd=Math.min(Math.max(transport.loopEnd,transport.loopStart+.01),transport.duration)}}
    function startTrackSource(track,when,position){if(!context||!track.buffer)return;stopSource(track,when);const source=context.createBufferSource(),reverse=transport.direction===-1;source.buffer=reverse?track.reverseBuffer:track.buffer;source.loop=true;source.connect(masterGainNode);const local=modulo(position,track.buffer.duration),offset=reverse?modulo(track.buffer.duration-local,track.buffer.duration):local;source.start(when,Math.min(offset,track.buffer.duration-.0001));track.source=source;setTrackState(track,'playing')}

    function scheduleLoopBoundary(){clearTimeout(loopTimer);if(!transport.playing||!context)return;const position=transportPosition(),remaining=transport.direction===1?transport.loopEnd-position:position-transport.loopStart,wait=Math.max(.02,remaining);loopTimer=setTimeout(()=>{if(!transport.playing||!context)return;const boundary=transport.direction===1?transport.loopStart:Math.max(transport.loopStart,transport.loopEnd-.001),when=context.currentTime+.025;transport.basePosition=boundary;transport.anchorAt=when;restartSources(boundary,when);scheduleLoopBoundary()},Math.max(10,wait*1000-18))}
    function playTransport(position=transportPosition()){if(!context||transport.duration<=0){setNotice('先に録音してください');return}const when=context.currentTime+.025;transport.basePosition=transport.loopStart+modulo(position-transport.loopStart,Math.max(.001,transport.loopEnd-transport.loopStart));transport.anchorAt=when;transport.playing=true;restartSources(transport.basePosition,when);scheduleLoopBoundary();setNotice('4 TRACK SHARED TAPE')}
    function stopTransport(){if(context&&transport.playing)transport.basePosition=transportPosition();transport.playing=false;clearTimeout(loopTimer);tracks.forEach(track=>{stopSource(track);if(track.buffer&&track.state!=='recording')setTrackState(track,'ready')});drawComposite()}
    function seekTransport(position,{record=true}={}){if(transport.duration<=0)return;transport.basePosition=transport.loopStart+modulo(position-transport.loopStart,Math.max(.001,transport.loopEnd-transport.loopStart));transport.anchorAt=context?.currentTime||0;if(transport.playing)playTransport(transport.basePosition);if(record)recordTake('loop-position',{position:transport.basePosition})}
    function setTransportLoop(start,end,{record=true}={}){if(transport.duration<=0)return;start=Math.max(0,Math.min(transport.duration-.01,start));end=Math.max(start+.01,Math.min(transport.duration,end));transport.loopStart=start;transport.loopEnd=end;transport.basePosition=start;transport.anchorAt=context?.currentTime||0;if(transport.playing)playTransport(start);if(record){recordTake('loop-position',{start,end});recordTake('loop-length',{division:divisions[transport.divisionIndex].name,seconds:end-start})}drawComposite()}
    function setDivision(index,anchor=transportPosition(),{record=true}={}){transport.divisionIndex=Math.max(0,Math.min(divisions.length-1,index));const item=divisions[transport.divisionIndex];document.querySelectorAll('.divisions button').forEach((button,buttonIndex)=>button.classList.toggle('active',buttonIndex===transport.divisionIndex));if(transport.duration>0){const length=Math.max(.03,transport.duration*item.ratio),start=Math.min(Math.max(0,anchor),Math.max(0,transport.duration-length));setTransportLoop(start,Math.min(transport.duration,start+length),{record})}}
    function toggleDirection(direction=transport.direction*-1,{record=true}={}){if(context&&transport.playing)transport.basePosition=transportPosition();transport.direction=direction<0?-1:1;transport.anchorAt=context?.currentTime||0;$('#reverseButton').textContent=transport.direction===-1?'REVERSE':'FORWARD';$('#reverseButton').classList.toggle('reverse',transport.direction===-1);if(transport.playing)playTransport(transport.basePosition);if(record)recordTake('direction',{direction:transport.direction});drawComposite()}
    function playTrack(track){if(!context||!track.buffer)return;if(!transport.playing){playTransport();return}startTrackSource(track,context.currentTime+.015,transportPosition())}function stopSource(track,when=0){if(!track.source)return;try{track.source.stop(when)}catch{}track.source=null}function stopTrack(track){if(track.state==='recording'){finishRecord(track);return}stopSource(track);if(track.buffer){setTrackState(track,'ready');updateTrackTime(track,track.buffer.duration);drawTrack(track)}}
    function clearTrack(track){stopSource(track);Object.assign(track,{chunks:[],frames:0,buffer:null,reverseBuffer:null,peaks:[],peakMaximum:0,livePeaks:[],previewTick:0,silent:false});updateTrackTime(track,0);setTrackState(track,'empty');syncTransportDuration();if(transport.duration===0)stopTransport();drawTrack(track);drawComposite();setNotice(`TRACK ${track.index+1} 消去`)}
    $('#playAll').addEventListener('click',()=>playTransport(transportPosition()));$('#stopAll').addEventListener('click',stopTransport);$('#reverseButton').addEventListener('click',()=>toggleDirection());
    function formatTime(seconds){const minutes=Math.floor(seconds/60),remainder=seconds-minutes*60;return`${String(minutes).padStart(2,'0')}:${remainder.toFixed(1).padStart(4,'0')}`}function updateTrackTime(track,seconds,total=null,prefix=''){track.timeLabel.textContent=total===null?`${prefix}${formatTime(seconds)}`:`${formatTime(seconds)} / ${formatTime(total)}`}
    divisions.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.textContent=item.label;button.classList.toggle('active',index===0);button.addEventListener('click',()=>setDivision(index));$('#divisions').append(button)});
    function recordTake(type,value){if(!take.recording||!context)return;take.events.push({id:take.nextId++,type,time:transportPosition(),takeTime:Math.max(0,context.currentTime-take.startedAt),value:structuredClone(value),muted:false});updateTakeButtons()}
    function updateTakeButtons(){const record=$('#takeButton'),run=$('#runTakeButton');record.classList.toggle('recording',take.recording);record.textContent=take.recording?`STOP ${take.events.length}`:`TAKE ${take.events.length}`;run.classList.toggle('playing',take.playing);run.textContent=take.playing?'STOP RUN':'RUN TAKE';run.disabled=take.events.length===0}
    function stopTakePlayback(message='TAKE STOP'){take.playing=false;take.cursor=0;updateTakeButtons();if(message)setNotice(message)}
    function applyTakeEvent(event){if(event.muted)return;const value=event.value||{};if(event.type==='loop-position'){if(Number.isFinite(value.start)&&Number.isFinite(value.end))setTransportLoop(value.start,value.end,{record:false});else if(Number.isFinite(value.position))seekTransport(value.position,{record:false})}else if(event.type==='loop-length'){const index=divisions.findIndex(item=>item.name===value.division);if(index>=0){transport.divisionIndex=index;document.querySelectorAll('.divisions button').forEach((button,buttonIndex)=>button.classList.toggle('active',buttonIndex===index))}}else if(event.type==='direction')toggleDirection(value.direction,{record:false})}
    function processTakePlayback(){if(!take.playing||!context)return;const elapsed=Math.max(0,context.currentTime-take.playStartedAt);while(take.cursor<take.events.length&&take.events[take.cursor].takeTime<=elapsed+.008)applyTakeEvent(take.events[take.cursor++]);if(take.cursor>=take.events.length&&elapsed>(take.events.at(-1)?.takeTime||0)+.12)stopTakePlayback('TAKE COMPLETE')}
    function startTakePlayback(){if(!context||transport.duration<=0||take.events.length===0){setNotice('TAKEがありません');return}take.recording=false;stopTransport();const origin=take.origin||{position:0,loopStart:0,loopEnd:transport.duration,direction:1,divisionIndex:0};transport.divisionIndex=origin.divisionIndex||0;setTransportLoop(origin.loopStart,origin.loopEnd,{record:false});toggleDirection(origin.direction,{record:false});seekTransport(origin.position,{record:false});take.events.sort((a,b)=>a.takeTime-b.takeTime||a.id-b.id);take.cursor=0;take.playing=true;take.playStartedAt=context.currentTime+.025;playTransport(origin.position);updateTakeButtons();setNotice('PERFORMANCE TAKE RUN')}
    $('#takeButton').addEventListener('click',()=>{if(transport.duration<=0||!context){setNotice('先に録音してください');return}if(take.playing)stopTakePlayback('TAKE STOP');if(!take.recording){take.events=[];take.origin={position:transportPosition(),loopStart:transport.loopStart,loopEnd:transport.loopEnd,direction:transport.direction,divisionIndex:transport.divisionIndex};take.startedAt=context.currentTime;take.recording=true}else take.recording=false;updateTakeButtons();setNotice(take.recording?'PERFORMANCE TAKE 録音中':`TAKE ${take.events.length} EVENTS`);drawComposite()});$('#runTakeButton').addEventListener('click',()=>take.playing?stopTakePlayback('TAKE STOP'):startTakePlayback());updateTakeButtons();
    function sizeCanvas(canvas){const rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1,width=Math.max(1,Math.round(rect.width)),height=Math.max(1,Math.round(rect.height));canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);const draw=canvas.getContext('2d');draw.scale(ratio,ratio);return{draw,width,height}}
    function drawTrack(track,playhead=null){const{draw,width,height}=sizeCanvas(track.canvas);draw.clearRect(0,0,width,height);draw.strokeStyle='#aaa69b';draw.lineWidth=1;draw.beginPath();draw.moveTo(0,height/2);draw.lineTo(width,height/2);draw.stroke();const recording=track.state==='recording',peaks=recording?track.livePeaks:track.peaks;if(peaks.length){const maximum=Math.max(.000001,recording?Math.max(...peaks):track.peakMaximum),span=recording?width*Math.min(1,track.frames/(context.sampleRate*MAX_SECONDS)):width;draw.strokeStyle=colors[track.index];draw.lineWidth=Math.max(1,span/Math.max(1,peaks.length)*.72);draw.beginPath();for(let index=0;index<peaks.length;index++){const x=peaks.length===1?0:index/(peaks.length-1)*span,amplitude=peaks[index]/maximum*height*.42;draw.moveTo(x,height/2-amplitude);draw.lineTo(x,height/2+amplitude)}draw.stroke()}if(track.silent&&!recording){draw.fillStyle='#777269';draw.font='700 9px ui-monospace,monospace';draw.textAlign='center';draw.fillText('SILENCE',width/2,height/2-5)}if(playhead!==null){const x=Math.max(0,Math.min(width,width*playhead));draw.strokeStyle='#11110f';draw.lineWidth=2;draw.beginPath();draw.moveTo(x,0);draw.lineTo(x,height);draw.stroke()}}
    function drawComposite(){const canvas=$('#compositeWave'),{draw,width,height}=sizeCanvas(canvas),band=height/4;draw.clearRect(0,0,width,height);if(transport.duration>0&&transport.loopEnd>transport.loopStart){const x=transport.loopStart/transport.duration*width,w=(transport.loopEnd-transport.loopStart)/transport.duration*width;draw.fillStyle='rgba(17,17,15,.08)';draw.fillRect(x,0,w,height);draw.strokeStyle='#11110f';draw.lineWidth=1;draw.strokeRect(x+.5,.5,Math.max(0,w-1),height-1)}tracks.forEach((track,trackIndex)=>{const center=band*(trackIndex+.5);draw.strokeStyle='#d0ccc0';draw.lineWidth=1;draw.beginPath();draw.moveTo(0,center);draw.lineTo(width,center);draw.stroke();if(!track.peaks.length||!track.buffer||transport.duration<=0)return;const repeats=Math.max(1,Math.ceil(transport.duration/track.buffer.duration)),maximum=Math.max(.000001,track.peakMaximum);draw.strokeStyle=colors[trackIndex];draw.lineWidth=1;draw.beginPath();for(let repeat=0;repeat<repeats;repeat++){const repeatStart=repeat*track.buffer.duration;for(let index=0;index<track.peaks.length;index+=Math.max(1,Math.floor(track.peaks.length/Math.max(1,width)))){const time=repeatStart+index/Math.max(1,track.peaks.length-1)*track.buffer.duration;if(time>transport.duration)break;const x=time/transport.duration*width,amplitude=track.peaks[index]/maximum*band*.39;draw.moveTo(x,center-amplitude);draw.lineTo(x,center+amplitude)}}draw.stroke()});for(const event of take.events){if(transport.duration<=0)continue;const x=event.time/transport.duration*width;draw.strokeStyle=event.muted?'rgba(242,79,66,.25)':'#f24f42';draw.lineWidth=1;draw.beginPath();draw.moveTo(x,0);draw.lineTo(x,height);draw.stroke()}if(transport.duration>0){const x=transportPosition()/transport.duration*width;draw.strokeStyle='#11110f';draw.lineWidth=2;draw.beginPath();draw.moveTo(x,0);draw.lineTo(x,height);draw.stroke();draw.fillStyle='#11110f';draw.beginPath();draw.moveTo(x-5,0);draw.lineTo(x+5,0);draw.lineTo(x,7);draw.closePath();draw.fill()}}
    const composite=$('#composite'),gesture={pointerId:null,startX:0,startY:0,startPosition:0,lastPosition:0,moved:false,grabbing:false,holdTimer:0,priorLoop:null,startDivision:0,editEventId:null,editDeleted:false};function pointerPosition(event){const rect=composite.getBoundingClientRect();return Math.max(0,Math.min(transport.duration,(event.clientX-rect.left)/rect.width*transport.duration))}function nearestTakeEvent(event,threshold=12){if(!take.events.length||transport.duration<=0)return null;const rect=composite.getBoundingClientRect(),x=event.clientX-rect.left;let nearest=null,distance=Infinity;for(const item of take.events){const delta=Math.abs(item.time/transport.duration*rect.width-x);if(delta<distance){distance=delta;nearest=item}}return distance<=threshold?nearest:null}
    composite.addEventListener('pointerdown',event=>{if(transport.duration<=0)return;composite.setPointerCapture(event.pointerId);const editable=nearestTakeEvent(event);Object.assign(gesture,{pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,startPosition:pointerPosition(event),lastPosition:pointerPosition(event),moved:false,grabbing:false,priorLoop:{start:transport.loopStart,end:transport.loopEnd},startDivision:transport.divisionIndex,editEventId:editable?.id??null,editDeleted:false});if(editable){gesture.holdTimer=setTimeout(()=>{const index=take.events.findIndex(item=>item.id===editable.id);if(index>=0){take.events.splice(index,1);gesture.editDeleted=true;navigator.vibrate?.(20);updateTakeButtons();drawComposite();setNotice('EVENT DELETE — AUDIO SAFE')}},520);return}gesture.holdTimer=setTimeout(()=>{gesture.grabbing=true;recordTake('grab-start',{position:gesture.startPosition});setDivision(transport.divisionIndex,gesture.startPosition);if(!transport.playing)playTransport(gesture.startPosition);setNotice('GRAB')},220)});
    composite.addEventListener('pointermove',event=>{if(event.pointerId!==gesture.pointerId)return;const position=pointerPosition(event),dx=event.clientX-gesture.startX,dy=event.clientY-gesture.startY;if(Math.abs(dx)>6||Math.abs(dy)>6)gesture.moved=true;if(gesture.editEventId!==null){if(gesture.moved)clearTimeout(gesture.holdTimer);return}if(gesture.grabbing){const divisionIndex=Math.max(0,Math.min(divisions.length-1,gesture.startDivision+Math.round(dy/18)));if(divisionIndex!==transport.divisionIndex)setDivision(divisionIndex,position);else{const length=transport.loopEnd-transport.loopStart,start=Math.min(Math.max(0,position),Math.max(0,transport.duration-length));setTransportLoop(start,start+length)}if(dx<-52&&transport.direction!==-1)toggleDirection(-1);gesture.lastPosition=position;return}if(Math.abs(dx)>8){clearTimeout(gesture.holdTimer);setTransportLoop(Math.min(gesture.startPosition,position),Math.max(gesture.startPosition,position));gesture.lastPosition=position}});
    function finishGesture(event){if(event.pointerId!==gesture.pointerId)return;clearTimeout(gesture.holdTimer);if(gesture.editEventId!==null){if(event.type!=='pointercancel'&&!gesture.moved&&!gesture.editDeleted){const item=take.events.find(entry=>entry.id===gesture.editEventId);if(item){item.muted=!item.muted;setNotice(item.muted?'EVENT MUTED — AUDIO SAFE':'EVENT ACTIVE')}}}else if(gesture.grabbing){recordTake('grab-end',{position:gesture.lastPosition});if(gesture.priorLoop){setTransportLoop(gesture.priorLoop.start,gesture.priorLoop.end,{record:false});seekTransport(gesture.lastPosition)}setNotice('GRAB END')}else if(!gesture.moved){seekTransport(pointerPosition(event));setNotice('SEEK')}gesture.pointerId=null;gesture.grabbing=false;gesture.editEventId=null;drawComposite()}composite.addEventListener('pointerup',finishGesture);composite.addEventListener('pointercancel',finishGesture);
    function updateFrame(){if(!inputActive||!analyser||!context)return;const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);let sum=0;for(const value of data)sum+=value*value;const rms=Math.sqrt(sum/data.length),level=Math.max(0,Math.min(100,(20*Math.log10(Math.max(rms,.00001))+60)/60*100));$('#meterFill').style.width=`${level}%`;const elapsed=Math.floor((performance.now()-inputStartedAt)/1000);$('#sessionTime').textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`;processTakePlayback();const position=transportPosition();$('#transportTime').textContent=formatTime(position);for(const track of tracks)if(track.buffer&&track.state==='playing'){const local=modulo(position,track.buffer.duration);updateTrackTime(track,local,track.buffer.duration);drawTrack(track,local/track.buffer.duration)}drawComposite();meterFrame=requestAnimationFrame(updateFrame)}
    function applyLevels(){const inputValue=Number($('#inputGain').value),monitorValue=Number($('#monitor').value),outputValue=Number($('#output').value);$('#inputGainValue').textContent=`${inputValue>0?'+':''}${inputValue} dB`;$('#monitorValue').textContent=monitorValue<=-60?'OFF':`${monitorValue} dB`;$('#outputValue').textContent=`${outputValue} dB`;if(!context)return;const time=context.currentTime;inputGainNode?.gain.setTargetAtTime(db(inputValue),time,.02);monitorGainNode?.gain.setTargetAtTime(monitorValue<=-60?0:db(monitorValue),time,.02);masterGainNode?.gain.setTargetAtTime(db(outputValue),time,.02)}['inputGain','monitor','output'].forEach(id=>$(`#${id}`).addEventListener('input',applyLevels));applyLevels();drawComposite();window.addEventListener('resize',()=>{tracks.forEach(track=>drawTrack(track));drawComposite()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&inputActive)context?.resume()});
  </script>
